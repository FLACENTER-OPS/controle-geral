space-between;margin-bottom:14px}.home-title{font-size:20px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card,.panel,.field,.item,.action-item{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px}.card{text-align:left;cursor:pointer}.label,.section-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.value{font-size:28px;font-weight:800;margin-top:7px}.section{margin-top:18px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:8px 0;font-size:12px}.metric:last-child{border-bottom:0}.toolbar{display:flex;gap:10px;overflow-x:auto}.search,.input,textarea,select{background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px}table{border-collapse:collapse;width:100%;min-width:1260px}th,td{border-bottom:1px solid var(--border);padding:10px;text-align:left;font-size:12px;white-space:nowrap}th{background:var(--card);font-size:9px;color:var(--muted);text-transform:uppercase}.center{text-align:center}.deal-link{background:none;border:0;color:var(--blue);cursor:pointer}.status-select{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px;font-size:11px;max-width:150px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;justify-content:flex-end;z-index:50}.detail{width:min(650px,100%);height:100vh;overflow:auto;background:var(--surface);border-left:1px solid var(--border);padding:22px}.detail-header{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.detail-title{font-size:18px;font-weight:800}.detail-grid,.status-grid,.doc-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dmv-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dmv-summary .field{padding:10px}.dmv-warning{border:1px solid rgba(239,68,68,.45);background:rgba(239,68,68,.12);color:var(--red);border-radius:6px;padding:10px;margin:10px 0;font-size:12px;font-weight:700}.detail-section{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}.field-label{font-size:10px;color:var(--muted);text-transform:uppercase}.field-value{margin-top:5px;overflow:hidden;text-overflow:ellipsis}.list{display:flex;flex-direction:column;gap:8px}.item-title,.action-title{font-weight:800;font-size:13px}.item-meta,.action-desc{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px}.quick-actions,.doc-summary,.admin-actions,.action-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.note-box{display:grid;grid-template-columns:1fr auto;gap:8px}.empty,.loading{border:1px dashed var(--border);border-radius:6px;padding:18px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:10px 18px;border-radius:8px;display:none;z-index:80}.toast.show{display:block}@media(max-width:900px){.grid,.panels,.detail-grid,.status-grid,.doc-controls,.dmv-summary{grid-template-columns:1fr}.stats{display:none}}</style></head><body><div class="header"><div class="logo">FA</div><div><div class="title">Controle Geral de Vendas</div><div class="sub">Florida Auto Center · DEAL_MASTER</div></div><div class="stats"><span class="chip green" id="sComplete">0 completos</span><span class="chip amber" id="sPending">0 pendentes</span><span class="chip red" id="sCritical">0 críticos</span><span class="chip" id="sTotal">0 total</span></div></div><div class="nav"><button id="navHome" class="active" onclick="switchView('home')">Home</button><button id="navDeals" onclick="switchView('deals')">Deals</button></div><main id="homeView" class="view home"><div class="loading">Carregando dashboard operacional...</div></main><main id="dealsView" class="view hidden"><div class="toolbar"><button class="btn primary" onclick="openModal()">+ Novo ion_needed','Reenviar'],['done','Concluído']],parcelamento_status:[['not_needed','Não se aplica'],['pending','Pendente'],['created','Criado']],title_status:[['missing','Ausente'],['electronic','Eletrônico'],['received','Recebido']],omnia_status:[['pending','Pendente'],['done','Feito']],folder_status:[['pending','Pendente'],['done','Feito']],envelope_status:[['pending','Pendente'],['done','Feito']]};const TONES={pending:'pending',pending_dispatch:'pending',with_dispatcher:'pending',blocked:'critical',rejected:'critical',resubmission_needed:'critical',missing:'critical',approved:'ok',paid:'ok',sent:'ok',done:'ok',created:'ok',received:'ok',electronic:'ok',not_needed:'ok'};let allDeals=[],currentFilter='ativos',searchTerm='',dmvConfig={users:[],dispatchers:[]},detailState={id:null,deal:null,alerts:[],history:[],documents:[],notes:[],actions:[],health:null,loading:false};function switchView(v){homeView.classList.toggle('hidden',v!=='home');dealsView.classList.toggle('hidden',v!=='deals');navHome.classList.toggle('active',v==='home');navDeals.classList.toggle('active',v==='deals')}async function loadFromSheets(){try{const data=await(await fetch(`${SCRIPT_URL}?source=DEAL_MASTER`)).json();if(!data.success)throw Error(data.error||'Erro');allDeals=(data.deals||[]).map(normalizeDeal);renderTable()}catch(e){tableBody.innerHTML='<tr><td colspan="17" class="empty">Erro ao carregar DEAL_MASTER.</td></tr>'}}async function loadDmvConfig(){try{const data=await(await fetch(`${SCRIPT_URL}?action=getDmvConfig`)).json();if(!data.success)throw Error(data.error||'Erro');dmvConfig={users:data.users||[],dispatchers:data.dispatchers||[]}}catch(e){dmvConfig={users:[],dispatchers:[]}}}async function loadDashboard(){try{const data=await(await fetch(`${SCRIPT_URL}?action=getDashboardMetrics`)).json();renderDashboard(data.success?data:{})}catch(e){renderDashboard({})}}function renderDashboard(d){const s=d.summary||{},h=d.health||{},sla=d.sla||{},a=d.alerts||{},doc=d.documents||{},dmv=d.dmv||{},dmvSla=d.dmvSla||{},p=d.parcelamentos||{},c=d.commission||{},ch=d.charts||{},ac=d.actionCenter||{};homeView.innerHTML=`<div class="home-head"><div><div class="home-title">Home Operacional</div><div class="sub">Visão executiva diária · DMV SLA</div></div><button class="filter-btn" onclick="loadDashboard()">Atualizar</button></div><div class="grid">${card('Deals Ativos',s.activeDeals,'green','ativos')}${card('Deals Críticos',s.criticalDeals,'red','alertas')}${card('DMV Pendentes',s.dmvPending,'amber','dmv-pending')}${card('Com Despachante',dmvSla.with_dispatcher,'amber','dmv-dispatcher')}${card('DMV Due Today',dmvSla.due_today,'amber','dmv-due')}${card('DMV Overdue',dmvSla.overdue,'red','dmv-overdue')}${card('DMV Escalated',dmvSla.escalated,'red','dmv-escalated')}${card('Deals Completos',s.completedDeals,'green','aprovados')}</div>${section('Action Center',actionCenter(ac))}${section('Automações / Modo Teste',notificationAdmin())}${section('System Health',`<div class="panels">${metrics('Health',[['Saudáveis',pct(h.okPercent)],['Atenção',pct(h.attentionPercent)],['Críticos',pct(h.criticalPercent)],['Alertas abertos',n(h.openAlerts)]])}${bars('Deals por health score',ch.healthScore||[])}${bars('Aging distribution',ch.agingDistribution||[])}</div>`)}${section('DMV SLA',`<div class="panels">${metrics('DMV SLA',[['Com despachante',n(dmvSla.with_dispatcher)],['Due today',n(dmvSla.due_today)],['Overdue',n(dmvSla.overdue)],['Escalated',n(dmvSla.escalated)]])}${metrics('DMV status',[['Pending',n(dmv.pending)],['With dispatcher',n(dmv.with_dispatcher)],['Sent',n(dmv.sent)],['Rejected',n(dmv.rejected)],['Resubmission',n(dmv.resubmission_needed)],['Done',n(dmv.done)]])}${bars('DMV overview',ch.dmvStatus||[])}</div>`)}${section('SLA Operacional',`<div class="panels">${metrics('SLA',[['Aging médio ativos',days(sla.activeAverageAging)],['Conclusão média',days(sla.completedAverageDays)],['Acima de 60 dias',n(sla.over60)]])}${metrics('Faixas',[['0-21 OK',n((sla.ranges||{}).ok)],['22-45 '):'<div class="empty">Sem dados</div>'}</div></div>`}function actionCenter(ac){const c=ac.counters||{};return`<div class="panels">${metrics('Contadores',[['Ações abertas',n(c.open)],['Críticas',n(c.critical)],['Altas',n(c.high)],['Médias',n(c.medium)],['Resolvidas',n(c.resolved)]])}${list('Top prioridades do dia',(ac.topPriorities||[]).slice(0,5).map(ai))}${list('Aging crítico',(ac.agingCritical||[]).slice(0,5).map(ai))}</div>`}function notificationAdmin(){return`<div class="panel"><div class="admin-actions"><button class="filter-btn" onclick="runAutomation('sendTestTelegramNotification')">Enviar teste Telegram</button><button class="filter-btn" onclick="runAutomation('sendDailyDigest')">Enviar digest diário</button><button class="filter-btn" onclick="runAutomation('processNotificationReminders')">Processar lembretes</button></div><div class="item-meta" id="notificationStatus">Modo teste ativo. Tokens e chat id ficam somente nas Script Properties.</div></div>`}async function runAutomation(action){const el=document.getElementById('notificationStatus');if(el)el.textContent='Executando...';try{const r=await(await fetch(`${SCRIPT_URL}?action=${encodeURIComponent(action)}`)).json();if(!r.success)throw Error(r.error||'Erro');if(el)el.textContent=action==='processNotificationReminders'?`Lembretes processados: ${n(r.reminders_sent)} enviados.`:action==='sendDailyDigest'?'Digest diário enviado em modo teste.':'Teste Telegram enviado com sucesso.';toast('Automação executada!');if(action!=='sendTestTelegramNotification')loadDashboard()}catch(e){if(el)el.textContent='Erro: '+(e.message||'falha');toast('Erro na automação')}}function ai(a){return{title:`${a.deal_id||'—'} · ${a.title||'Ação'}`,meta:`${a.priority||'—'} · ${a.category||'Operacional'} · ${a.recommended_owner||'—'}`}}function leader(items){return`<div class="panel"><div class="section-title">Leaderboard</div>${items.slice(0,8).map(i=>`<div class="metric"><span>${esc(i.seller||'—')}</span><b>${n(i.alerts)} alertas</b></div>`).join('')||'<div class="empty">Sem dados</div>'}</div>`}function normalizeDeal(d={}){const id=d.deal_id||d.dealId||d.id||'';return{...d,id:String(id),deal_id:String(id),dealId:String(id),data:d.sale_date||d.data||'',veiculo:d.vehicle||d.veiculo||'',vendedor:d.seller||d.vendedor||'',alerts:d.alerts||[],alert_count:Number(d.alert_count||(d.alerts||[]).length||0),critical_alert_count:Number(d.critical_alert_count||0),hub_status:d.hub_status||(d.dmv_status==='done'?'completed':'active'),review_status:d.review_status||'pending',commission_status:d.commission_status||'pending',dmv_status:d.dmv_status||'pending',parcelamento_status:d.parcelamento_status||'',title_status:d.title_status||'',omnia_status:d.omnia_status||'',folder_status:d.folder_status||'',envelope_status:d.envelope_status||'',dmv_owner:d.dmv_owner||'',dmv_dispatcher:d.dmv_dispatcher||'',dmv_sent_date:d.dmv_sent_date||'',dmv_due_date:d.dmv_due_date||'',dmv_last_followup_at:d.dmv_last_followup_at||'',dmv_followup_count:d.dmv_followup_count||0,dmv_sla_status:d.dmv_sla_status||''}}function renderTable(){const rows=allDeals.filter(d=>{const q=searchTerm,m=!q||[d.dealId,d.vin,d.veiculo,d.vendedor,d.lender,d.deal_type,d.dmv_dispatcher,d.dmv_owner].some(v=>String(v||'').toLowerCase().includes(q));return m&&matchFilter(d)});tableBody.innerHTML=rows.length?rows.map(row).join(''):`<tr><td colspan="17" class="empty">${allDeals.length?'Nenhum deal encontrado.':'Nenhum deal no DEAL_MASTER.'}</td></tr>`;updateStats()}function row(d){return`<tr><td class="muted">${fmtDate(d.data)}</td><td>${agingBadge(d)}</td><td><button class="deal-link" onclick="openDealDetails('${js(d.id)}')">${esc(d.dealId||'—')}</button></td><td><b>${esc(d.veiculo||'—')}</b><div class="muted">${esc(d.vendedor||'—')}</div></td>${STATUS_FIELDS.map(f=>`<td>${statusSelect(d,f)}</td>`).join('')}<td>${alertBadge(d)}</td><td class="muted">${esc(d.lender||'—')}</td><td class="muted">${esc(d.deal_type||'—')}</td><td class="muted">${esc(d.gps_required||'—')}</td><td><button class="filter-btn" onclick="openDealDetails('${js(d.id)}')">Detalhes</button></td></tr>`}function matchFilter(d){const done=isDone(d),arch=String(d.hub_status||'').toLowerCase()==='archived',complete=STATUS_FIELDS.every(f=>completeStatus(d[f])),age=agingInfo(d),sla=String(d.dmv_sla_status||'').toLowerCase();return currentFilter==='todos'||currentFilter==='ativos'&&!done&&!arch||currentFilter==='pendentes'&&!complete||currentFilter==='aprovados'&&done||currentFilter==='arquivados'&&arch||currentFilter==='sem-pg'&&!completeStatus(d.commission_status)||currentFilter==='alertas'&&d.alert_count>0||currentFilter==='dmv-pending'&&String(d.dmv_status||'').toLowerCase()==='pending'||currentFilter==='dmv-dispatcher'&&String(d.dmv_status||'').toLowerCase()==='with_dispatcher'||currentFilter==='dmv-due'&&sla==='due_today'||currentFilter==='dmv-overdue'&&sla==='overdue'||currentFilter==='dmv-escalated'&&sla==='escalated'||currentFilter==='parcelamento-pending'&&['sim','yes','true'].includes(String(d.parcelado||'').toLowerCase())&&String(d.parcelamento_status||'').toLowerCase()!=='created'||currentFilter==='aging-60'&&age&&age.days>60||currentFilter==='docs-critical'&&d.critical_alert_count>0}function setFilter(f,b){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');renderTable()}function filterDeals(v){searchTerm=v.toLowerCase().trim();renderTable()}function statusSelect(d,f){const v=d[f]||'',opts=[['','—'],...(STATUS_CONFIG[f]||[])];if(v&&!opts.some(o=>o[0]===v))opts.push([v,v]);return`<select class="status-select ${tone(v)}" onchange="setMasterStatus('${js(d.id)}','${f}',this)">${opts.map(o=>`<option value="${attr(o[0])}" ${v===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`}async function setMasterStatus(id,field,sel){const d=allDeals.find(x=>x.id===id),old=d?d[field]:'';if(!d)return;if(field==='dmv_status'&&sel.value==='with_dispatcher'&&!d.dmv_dispatcher){sel.v ulo||'Veículo não informado')}</div></div><button class="btn" onclick="closeDealDetails()">×</button></div>${healthPanel(detailState.health)}${sec('Next Actions',renderNextActions(detailState.actions))}${sec('Informações gerais',`<div class="detail-grid">${field('Deal ID',d.deal_id||d.dealId)}${field('Veículo',d.vehicle||d.veiculo)}${field('Vendedor',d.seller||d.vendedor)}${field('Cliente',d.customer_name)}${field('Data',fmtDate(d.sale_date||d.data))}${field('Lender',d.lender)}${field('Tipo',d.deal_type)}${field('GPS',d.gps_required)}${field('Parcelado',d.parcelado)}</div>`)}${sec('Status operacionais',`<div class="status-grid">${STATUS_FIELDS.map(f=>`<div class="field"><div class="field-label">${statusLabel(f)}</div>${detailStatus(d,f)}</div>`).join('')}</div>`)}${sec('DMV / Registro',renderDmvSection(d))}${sec('Alertas ativos',renderAlerts(detailState.alerts))}${sec('Documentos',renderDocs(detailState.documents))}${sec('Internal Notes',renderNotes(detailState.notes))}${sec('Histórico',renderHistory(detailState.history))}`}function sec(t,c){return`<div class="detail-section"><div class="section-title">${esc(t)}</div>${c}</div>`}function field(l,v){return`<div class="field"><div class="field-label">${esc(l)}</div><div class="field-value">${esc(v||'—')}</div></div>`}function dmvField(l,v,formatter){if(v===undefined||v===null||String(v).trim()==='')return'';const shown=formatter?formatter(v):v;if(!shown||shown==='—')return'';return field(l,shown)}function renderDmvSection(d){return`${dmvValidationMessage(d)}<div class="dmv-summary">${dmvField('DMV Owner',d.dmv_owner)}${dmvField('Despachante',d.dmv_dispatcher)}${dmvField('Data enviada',d.dmv_sent_date,fmtDate)}${dmvField('Due Date DMV',d.dmv_due_date,fmtDate)}${dmvField('Último follow-up',d.dmv_last_followup_at,fmtDateTime)}${Number(d.dmv_followup_count||0)>0?field('Follow-ups',d.dmv_followup_count):''}${dmvField('SLA Status',d.dmv_sla_status,dmvSlaLabel)}</div><div class="detail-grid" style="margin-top:10px"><label>DM e.id,dmv_owner:document.getElementById('dmvOwnerSelect').value,dmv_dispatcher:dispatcher,dmv_sent_date:document.getElementById('dmvSentDateInput').value};const r=await post(payload);if(!r.success){toast('Erro ao salvar DMV');return}Object.assign(detailState.deal,r.dmv||payload);if(dispatcher&&!isFinalDmvStatus(detailState.deal.dmv_status))detailState.deal.dmv_status='with_dispatcher';const d=allDeals.find(x=>x.id===detailState.id);if(d)Object.assign(d,detailState.deal);if(r.health)detailState.health=r.health;if(r.next_actions)detailState.actions=r.next_actions;renderTable();renderDealDetails();toast('DMV atualizado!')}async function registerDmvFollowup(){if(!detailState.id)return;const r=await post({action:'registerDmvFollowup',deal_id:detailState.id});if(!r.success){toast('Erro no follow-up DMV');return}Object.assign(detailState.deal,r.dmv||{});if(r.health)detailState.health=r.health;if(r.next_actions)detailState.actions=r.next_actions;detailState.history=[{action:'dmv_followup',notes:'Follow-up DMV registrado',timestamp:new Date().toISOString()},...detailState.history];const d=allDeals.find(x=>x.id===detailState.id);if(d)Object.assign(d,detailState.deal);renderTable();renderDealDetails();toast('Follow-up DMV registrado!')}async function recalculateDealHealth(){if(!detailState.id)return;const r=await post({action:'syncDealHealth',deal_id:detailState.id});if(!r.success){toast('Erro ao recalcular Health');return}if(r.health)detailState.health=r.health;if(r.next_actions)detailState.actions=r.next_actions;await openDealDetails(detailState.id);toast('Health recalculado!')}function dmvSlaLabel(v){return{not_started:'Não iniciado',on_track:'No prazo',due_today:'Vence hoje',overdue:'Atrasado',escalated:'Escalado',completed:'Concluído'}[String(v||'').toLowerCase()]||v||'—'}function detailStatus(d,f){const v=d[f]||'',opts=[['','—'],...(STATUS_CONFIG[f]||[])];if(v&&!opts.some(o=>o[0]===v))opts.push([v,v]);return`<select class="status-select ${tone(v)}" onchange="setDetailStat {return{success:false,error:e.message}}}function openModal(){toast('Criação rápida mantida no backend; use a conferência ou fluxo atual.')}function closeDealDetails(){detailOverlay.classList.add('hidden');detailState={id:null,deal:null,alerts:[],history:[],documents:[],notes:[],actions:[],health:null,loading:false}}function outsideDetail(e){if(e.target===detailOverlay)closeDealDetails()}function resolveAction(id){detailState.actions=detailState.actions.filter(a=>a.action_id!==id);renderDealDetails();toast('Ação marcada como resolvida')}function focusNote(t){const input=document.getElementById('internalNoteText');if(input){input.value=input.value||`Ação: ${t} - `;input.focus()}}function scrollDocs(){[...document.querySelectorAll('.section-title')].find(x=>x.textContent.toLowerCase().includes('document'))?.scrollIntoView({behavior:'smooth'})}function updateStats(){const total=allDeals.length,comp=allDeals.filter(isDone).length,crit=allDeals.filter(d=>d.critical_alert_count>0).length;sTotal.textContent=total+' total';sComplete.textContent=comp+' completos';sPending.textContent=(total-comp)+' pendentes';sCritical.textContent=crit+' críticos'}function agingInfo(d){if(String(d.dmv_status||'').toLowerCase()==='done')return null;const sale=dateVal(d.data);if(!sale)return null;const today=new Date(),a=new Date(sale.getFullYear(),sale.getMonth(),sale.getDate()),b=new Date(today.getFullYear(),today.getMonth(),today.getDate()),days=Math.max(0,Math.floor((b-a)/86400000));return{days,tone:days<=21?'green':days<=45?'yellow':days<=60?'orange':'red'}}function agingBadge(d){const a=agingInfo(d);return a?`<span class="aging-badge ${a.tone}">${a.days}d</span>`:'<span class="aging-badge">—</span>'}function alertBadge(d){const c=d.alert_count||0,cr=d.critical_alert_count||0;return`<span class="alert-badge ${cr?'critical':c?'pending':''}">${cr?`${cr} crítico / ${c}`:c}</span>`}function dateVal(v){if(!v)return null;if(v instanceof Date)return isNaN(v)?null:v;if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400*1000));return isNaN(d)?null:d}const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],12);m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return new Date(+m[3],+m[1]-1,+m[2],12);const d=new Date(s);return isNaN(d)?null:d}function fmtDate(v){const d=dateVal(v);return d?d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}):'—'}function fmtDateTime(v){const d=dateVal(v)||new Date(String(v||''));return isNaN(d)?'—':d.toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}function dateInput(v){const d=dateVal(v);return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:''}function todayIso(){return new Date().toISOString().split('T')[0]}function completeStatus(v){return['approved','paid','sent','done','created','received','electronic','not_needed'].includes(String(v||'').toLowerCase())}function isDone(d){return String(d.dmv_status||'').toLowerCase()==='done'||String(d.hub_status||'').toLowerCase()==='completed'}function isFinalDmvStatus(v){return['done','rejected','resubmission_needed'].includes(String(v||'').toLowerCase())}function calcDoc(p,d){p=String(p||'pending').toLowerCase();d=String(d||'pending').toLowerCase();if(p==='missing'||d==='missing')return'critical';if(p==='ok'&&d==='ok')return'ok';return'pending'}function docSummary(d){return d.reduce((a,x)=>{a[calcDoc(x.printed_status,x.dealer_center_status)]++;return a},{ok:0,pending:0,critical:0})}function docLabel(v){return{ok:'OK',pending:'Pendente',missing:'Missing',critical:'Crítico'}[String(v||'').toLowerCase()]||v||'—'}function toneDmvSla(v){return{not_started:'pending',on_track:'ok',due_today:'pending',overdue:'critical',escalated:'critical',completed:'ok'}[String(v||'').toLowerCase()]||'pending'}function statusLabel(f){return{review_status:'Review',commission_status:'Comissão',dmv_status:'DMV',parcelamento_status:'Parcelamento',title_status:'Title',omnia_status:'OMNIA',folder_status:'Folder',envelope_status:'Envelope'}[f]||f}function n(v){return v===undefined||v===null||v===''?'0':String(v)}function pct(v){return n(v)+'%'}function days(v){return v?`${v}d`:'—'}function short(v){v=String(v);return v.length>16?v.slice(0,15)+'…':v}function tone(p){return TONES[String(p||'').toLowerCase()]||{critical:'critical',high:'high',medium:'medium',low:'ok',ok:'ok',pending:'pending',missing:'critical'}[String(p||'').toLowerCase()]||'pending'}function isCrit(v){return['critical','critico','crítico','high','alta'].includes(String(v||'').toLowerCase())}function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function attr(v){return esc(v).replace(/\n/g,'&#10;')}function js(v){return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function toast(m){toastEl.textContent=m;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800)}const toastEl=document.getElementById('toast');switchView('home');Promise.all([loadDmvConfig(),loadFromSheets(),loadDashboard()]);</script></body></html>
