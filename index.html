<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle Geral</title><style>:root{--bg:#0a0d12;--surface:#111520;--card:#161c2a;--border:#1e2840;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--text:#e2e8f0;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.header,.nav,.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px}.header{display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:5}.logo{width:30px;height:30px;border-radius:7px;background:var(--green);color:#07110d;display:grid;place-items:center;font-weight:800}.title{font-weight:800}.sub,.muted{color:var(--muted);font-size:11px}.stats{margin-left:auto;display:flex;gap:8px}.chip,.badge,.aging-badge,.alert-badge{border:1px solid var(--border);border-radius:20px;padding:4px 8px;font-size:11px;color:var(--muted)}.ok,.green{color:var(--green)!important;background:rgba(16,185,129,.12)!important;border-color:rgba(16,185,129,.45)!important}.pending,.amber,.medium{color:var(--amber)!important;background:rgba(245,158,11,.12)!important;border-color:rgba(245,158,11,.45)!important}.critical,.red,.high,.missing{color:var(--red)!important;background:rgba(239,68,68,.12)!important;border-color:rgba(239,68,68,.45)!important}.risk,.orange{color:#fb923c!important;background:rgba(251,146,60,.12)!important;border-color:rgba(251,146,60,.45)!important}.nav{display:flex;gap:8px}.btn,.nav button,.filter-btn,.quick-btn{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:12px;padding:8px 12px;cursor:pointer}.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.nav button.active,.btn:hover,.filter-btn:hover,.filter-btn.active{border-color:var(--blue);color:var(--blue)}.hidden{display:none!important}.home,.table-wrap{padding:18px 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card,.panel,.field,.item,.action-item{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px}.card{text-align:left;cursor:pointer}.label,.section-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.value{font-size:28px;font-weight:800;margin-top:7px}.section{margin-top:18px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:8px 0;font-size:12px}.toolbar{display:flex;gap:10px;overflow-x:auto}.search,.input,textarea,select{background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px}textarea{width:100%;min-height:76px}label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}table{border-collapse:collapse;width:100%;min-width:1260px}th,td{border-bottom:1px solid var(--border);padding:10px;text-align:left;font-size:12px;white-space:nowrap}th{background:var(--card);font-size:9px;color:var(--muted);text-transform:uppercase}.deal-link{background:none;border:0;color:var(--blue);cursor:pointer}.status-select{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px;font-size:11px;max-width:150px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;justify-content:flex-end;z-index:50}.detail{width:min(700px,100%);height:100vh;overflow:auto;background:var(--surface);border-left:1px solid var(--border);padding:22px}.detail-header{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.detail-title{font-size:18px;font-weight:800}.detail-grid,.status-grid,.doc-controls,.return-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-section{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}.field-label{font-size:10px;color:var(--muted);text-transform:uppercase}.field-value{margin-top:5px;overflow:hidden;text-overflow:ellipsis}.list{display:flex;flex-direction:column;gap:8px}.item-title,.action-title{font-weight:800;font-size:13px}.item-meta,.action-desc{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px}.quick-actions,.doc-summary,.admin-actions,.action-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.return-checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.return-checks label{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:9px;flex-direction:row;align-items:center;color:var(--text)}.whatsapp-box{white-space:pre-wrap;background:#0d111a;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:12px;color:var(--text);margin-top:10px}.empty,.loading{border:1px dashed var(--border);border-radius:6px;padding:18px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:10px 18px;border-radius:8px;display:none;z-index:80}.toast.show{display:block}@media(max-width:900px){.grid,.panels,.detail-grid,.status-grid,.doc-controls,.return-grid,.return-checks{grid-template-columns:1fr}.stats{display:none}}</style></head><body><div class="header"><div class="logo">FA</div><div><div class="title">Controle Geral de Vendas</div><div class="sub">Florida Auto Center · DEAL_MASTER</div></div><div class="stats"><span class="chip green" id="sComplete">0 completos</span><span class="chip amber" id="sPending">0 pendentes</span><span class="chip red" id="sCritical">0 críticos</span><span class="chip" id="sTotal">0 total</span></div></div><div class="nav"><button id="navHome" class="active" onclick="switchView('home')">Home</button><button id="navDeals" onclick="switchView('deals')">Deals</button></div><main id="homeView" class="home"><div class="loading">Carregando dashboard...</div></main><main id="dealsView" class="hidden"><div class="toolbar"><button class="btn primary" onclick="toast('Criação rápida mantida no backend.')">+ Novo Deal</button><input class="search" placeholder="Buscar deal, VIN, vendedor..." oninput="filterDeals(this.value)"><button class="filter-btn active" onclick="setFilter('ativos',this)">Ativos</button><button class="filter-btn" onclick="setFilter('pendentes',this)">Pendentes</button><button class="filter-btn" onclick="setFilter('aprovados',this)">Completos</button><button class="filter-btn" onclick="setFilter('arquivados',this)">Arquivados</button><button class="filter-btn" onclick="setFilter('sem-pg',this)">Comissão pendente</button><button class="filter-btn" onclick="setFilter('alertas',this)">Com alertas</button><button class="filter-btn" onclick="setFilter('todos',this)">Todos</button></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Aging</th><th>Deal</th><th>Veículo / Vendedor</th><th>Review</th><th>Comissão</th><th>DMV</th><th>Parcelamento</th><th>Title</th><th>OMNIA</th><th>Folder</th><th>Envelope</th><th>Alertas</th><th>Lender</th><th>Tipo</th><th>GPS</th><th>Ações</th></tr></thead><tbody id="tableBody"><tr><td colspan="17" class="empty">Carregando...</td></tr></tbody></table></div></main><div id="detailOverlay" class="overlay hidden" onclick="outsideDetail(event)"><aside class="detail"><div id="detailContent"></div></aside></div><div id="toast" class="toast">Salvo!</div><script>const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzKONEy9LywAzjGqmtmdUDodSDK7oLySpAIRjoi6KpG6txCb-VT9T6zYJ-Zgx4IcUda/exec';const STATUS_FIELDS=['review_status','commission_status','dmv_status','parcelamento_status','title_status','omnia_status','folder_status','envelope_status'];const STATUS_CONFIG={review_status:[['pending','Pendente'],['approved','Aprovado'],['rejected','Rejeitado']],commission_status:[['pending','Pendente'],['blocked','Bloqueada'],['approved','Aprovada'],['paid','Paga']],dmv_status:[['pending','Pendente'],['pending_dispatch','Aguardando despachante'],['with_dispatcher','Com despachante'],['sent','Enviado'],['rejected','Rejeitado'],['resubmission_needed','Reenviar'],['done','Concluído']],parcelamento_status:[['not_needed','Não se aplica'],['pending','Pendente'],['created','Criado']],title_status:[['missing','Ausente'],['electronic','Eletrônico'],['received','Recebido']],omnia_status:[['pending','Pendente'],['done','Feito']],folder_status:[['pending','Pendente'],['done','Feito']],envelope_status:[['pending','Pendente'],['done','Feito']]};const TONES={pending:'pending',pending_dispatch:'pending',with_dispatcher:'pending',blocked:'critical',rejected:'critical',resubmission_needed:'critical',missing:'critical',approved:'ok',paid:'ok',sent:'ok',done:'ok',created:'ok',received:'ok',electronic:'ok',not_needed:'ok'};let allDeals=[],currentFilter='ativos',searchTerm='',dmvConfig={users:[],dispatchers:[]},detailState={id:null,deal:null,alerts:[],history:[],documents:[],notes:[],actions:[],health:null,returns:[],loading:false};function switchView(v){homeView.classList.toggle('hidden',v!=='home');dealsView.classList.toggle('hidden',v!=='deals');navHome.classList.toggle('active',v==='home');navDeals.classList.toggle('active',v==='deals')}async function loadFromSheets(){try{const data=await(await fetch(`${SCRIPT_URL}?source=DEAL_MASTER`)).json();if(!data.success)throw Error(data.error||'Erro');allDeals=(data.deals||[]).map(normalizeDeal);renderTable()}catch(e){tableBody.innerHTML='<tr><td colspan="17" class="empty">Erro ao carregar DEAL_MASTER.</td></tr>'}}async function loadDmvConfig(){try{const d=await(await fetch(`${SCRIPT_URL}?action=getDmvConfig`)).json();if(d.success)dmvConfig={users:d.users||[],dispatchers:d.dispatchers||[]}}catch(e){}}async function loadDashboard(){try{const d=await(await fetch(`${SCRIPT_URL}?action=getDashboardMetrics`)).json();renderDashboard(d.success?d:{})}catch(e){renderDashboard({})}}function renderDashboard(d){const s=d.summary||{},h=d.health||{},dmv=d.dmvSla||{},ac=d.actionCenter||{};homeView.innerHTML=`<div class="home-head"><div><div class="home-title">Home Operacional</div><div class="sub">Visão executiva diária</div></div><button class="filter-btn" onclick="loadDashboard()">Atualizar</button></div><div class="grid">${card('Deals Ativos',s.activeDeals,'green','ativos')}${card('Deals Críticos',s.criticalDeals,'red','alertas')}${card('Deals em Risco',s.riskDeals,'orange','risk')}${card('DMV Pendentes',s.dmvPending,'amber','dmv-pending')}${card('Com Despachante',dmv.with_dispatcher,'amber','dmv-dispatcher')}${card('DMV Overdue',dmv.overdue,'red','dmv-overdue')}${card('Aging 60+',s.aging60,'red','aging-60')}${card('Comissão Pendente',s.commissionPending,'amber','sem-pg')}${card('Deals Completos',s.completedDeals,'green','aprovados')}</div>${section('Action Center',actionCenter(ac))}${section('System Health',`<div class="panels">${metrics('Health',[['Saudáveis',pct(h.okPercent)],['Atenção',pct(h.attentionPercent)],['Risco',pct(h.riskPercent)],['Críticos',pct(h.criticalPercent)],['Alertas abertos',n(h.openAlerts)]])}</div>`)}`}function card(t,v,tone,f){return`<button class="card ${tone}" onclick="goFilter('${f}')"><div class="label">${esc(t)}</div><div class="value">${n(v)}</div></button>`}function goFilter(f){switchView('deals');setFilter(f)}function section(t,c){return`<div class="section"><div class="section-title">${esc(t)}</div>${c}</div>`}function metrics(t,rows){return`<div class="panel"><div class="section-title">${esc(t)}</div>${rows.map(r=>`<div class="metric"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}</div>`}function actionCenter(ac){const c=ac.counters||{};return`<div class="panels">${metrics('Contadores',[['Ações abertas',n(c.open)],['Críticas',n(c.critical)],['Altas',n(c.high)],['Médias',n(c.medium)]])}${list('Top prioridades',(ac.topPriorities||[]).slice(0,5).map(ai))}</div>`}function list(t,items){return`<div class="panel"><div class="section-title">${esc(t)}</div><div class="list">${items.length?items.map(i=>`<div class="item"><div class="item-title">${esc(i.title)}</div><div class="item-meta">${esc(i.meta||'')}</div></div>`).join(''):'<div class="empty">Sem dados</div>'}</div></div>`}function ai(a){return{title:`${a.deal_id||'—'} · ${a.title||'Ação'}`,meta:`${a.priority||'—'} · ${a.category||'Operacional'} · ${a.recommended_owner||'—'}`}}function normalizeDeal(d={}){const id=d.deal_id||d.dealId||d.id||'';return{...d,id:String(id),deal_id:String(id),dealId:String(id),data:d.sale_date||d.data||'',veiculo:d.vehicle||d.veiculo||'',vendedor:d.seller||d.vendedor||'',alerts:d.alerts||[],alert_count:Number(d.alert_count||(d.alerts||[]).length||0),critical_alert_count:Number(d.critical_alert_count||0),hub_status:d.hub_status||(d.dmv_status==='done'?'completed':'active'),review_status:d.review_status||'pending',commission_status:d.commission_status||'pending',dmv_status:d.dmv_status||'pending',parcelamento_status:d.parcelamento_status||'',title_status:d.title_status||'',omnia_status:d.omnia_status||'',folder_status:d.folder_status||'',envelope_status:d.envelope_status||'',dmv_owner:d.dmv_owner||'',dmv_dispatcher:d.dmv_dispatcher||'',dmv_sent_date:d.dmv_sent_date||'',dmv_due_date:d.dmv_due_date||'',dmv_last_followup_at:d.dmv_last_followup_at||'',dmv_followup_count:d.dmv_followup_count||0,dmv_sla_status:d.dmv_sla_status||'',dmv_return_status:d.dmv_return_status||'not_received',protocol_status:d.protocol_status||'not_generated',protocol_signed_at:d.protocol_signed_at||'',plate_number:d.plate_number||''}}function renderTable(){const rows=allDeals.filter(d=>{const q=searchTerm,m=!q||[d.dealId,d.vin,d.veiculo,d.vendedor,d.lender,d.deal_type,d.dmv_dispatcher,d.dmv_owner,d.plate_number].some(v=>String(v||'').toLowerCase().includes(q));return m&&matchFilter(d)});tableBody.innerHTML=rows.length?rows.map(row).join(''):`<tr><td colspan="17" class="empty">${allDeals.length?'Nenhum deal encontrado.':'Nenhum deal no DEAL_MASTER.'}</td></tr>`;updateStats()}function row(d){return`<tr><td class="muted">${fmtDate(d.data)}</td><td>${agingBadge(d)}</td><td><button class="deal-link" onclick="openDealDetails('${js(d.id)}')">${esc(d.dealId||'—')}</button></td><td><b>${esc(d.veiculo||'—')}</b><div class="muted">${esc(d.vendedor||'—')}</div></td>${STATUS_FIELDS.map(f=>`<td>${statusSelect(d,f)}</td>`).join('')}<td>${alertBadge(d)}</td><td class="muted">${esc(d.lender||'—')}</td><td class="muted">${esc(d.deal_type||'—')}</td><td class="muted">${esc(d.gps_required||'—')}</td><td><button class="filter-btn" onclick="openDealDetails('${js(d.id)}')">Detalhes</button></td></tr>`}function matchFilter(d){const done=isDone(d),arch=String(d.hub_status||'').toLowerCase()==='archived',complete=STATUS_FIELDS.every(f=>completeStatus(d[f])),age=agingInfo(d),sla=String(d.dmv_sla_status||'').toLowerCase();return currentFilter==='todos'||currentFilter==='ativos'&&!done&&!arch||currentFilter==='pendentes'&&!complete||currentFilter==='aprovados'&&done||currentFilter==='arquivados'&&arch||currentFilter==='sem-pg'&&!completeStatus(d.commission_status)||currentFilter==='alertas'&&d.alert_count>0||currentFilter==='risk'&&(String(d.health_score||'').toLowerCase()==='risk'||age&&age.days>=46&&age.days<=60)||currentFilter==='dmv-pending'&&String(d.dmv_status||'').toLowerCase()==='pending'||currentFilter==='dmv-dispatcher'&&String(d.dmv_status||'').toLowerCase()==='with_dispatcher'||currentFilter==='dmv-overdue'&&['overdue','escalated'].includes(sla)||currentFilter==='aging-60'&&age&&age.days>60||currentFilter==='docs-critical'&&d.critical_alert_count>0}function setFilter(f,b){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');renderTable()}function filterDeals(v){searchTerm=v.toLowerCase().trim();renderTable()}function statusSelect(d,f){const v=d[f]||'',opts=[['','—'],...(STATUS_CONFIG[f]||[])];if(v&&!opts.some(o=>o[0]===v))opts.push([v,v]);return`<select class="status-select ${tone(v)}" onchange="setMasterStatus('${js(d.id)}','${f}',this)">${opts.map(o=>`<option value="${attr(o[0])}" ${v===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`}async function setMasterStatus(id,field,sel){const d=allDeals.find(x=>x.id===id),old=d?d[field]:'';if(!d)return;if(field==='dmv_status'&&sel.value==='with_dispatcher'&&!d.dmv_dispatcher){sel.value=old;toast('Selecione o despachante no Deal Details antes de salvar.');return}d[field]=sel.value;if(field==='dmv_status')d.hub_status=sel.value==='done'?'completed':'active';const r=await post({action:'updateStatus',deal_id:id,field,value:sel.value});if(!r.success){d[field]=old;sel.value=old;toast('Erro ao salvar')}else toast('Status atualizado!');renderTable();if(detailState.id===id)openDealDetails(id)}async function openDealDetails(id){const local=allDeals.find(d=>d.id===id)||null;detailState={id,deal:local,alerts:local?(local.alerts||[]):[],history:[],documents:[],notes:[],actions:[],health:null,returns:[],loading:true};detailOverlay.classList.remove('hidden');renderDealDetails();try{const data=await(await fetch(`${SCRIPT_URL}?action=getDealDetails&deal_id=${encodeURIComponent(id)}`)).json();if(!data.success)throw Error(data.error||'Erro');const deal=normalizeDeal({...data.deal,alerts:data.alerts||[]}),idx=allDeals.findIndex(d=>d.id===deal.id);if(idx>=0)allDeals[idx]={...allDeals[idx],...deal};detailState={id,deal,alerts:data.alerts||[],history:data.history||[],documents:data.documents||[],notes:data.notes||[],actions:data.next_actions||[],health:data.health||null,returns:data.dmv_returns||[],loading:false}}catch(e){detailState={...detailState,loading:false,error:e.message}}renderDealDetails()}function renderDealDetails(){const d=detailState.deal;if(detailState.loading&&!d){detailContent.innerHTML='<button class="btn" onclick="closeDealDetails()">×</button><div class="loading">Carregando detalhes...</div>';return}if(!d){detailContent.innerHTML=`<button class="btn" onclick="closeDealDetails()">×</button><div class="empty">${esc(detailState.error||'Deal não encontrado')}</div>`;return}detailContent.innerHTML=`<div class="detail-header"><div><div class="detail-title">Deal ${esc(d.dealId||d.id||'—')}</div><div class="sub">${esc(d.veiculo||'Veículo não informado')}</div></div><button class="btn" onclick="closeDealDetails()">×</button></div>${healthPanel(detailState.health)}${sec('Next Actions',renderNextActions(detailState.actions))}${sec('Informações gerais',`<div class="detail-grid">${field('Deal ID',d.deal_id||d.dealId)}${field('Veículo',d.vehicle||d.veiculo)}${field('Vendedor',d.seller||d.vendedor)}${field('Cliente',d.customer_name)}${field('Data',fmtDate(d.sale_date||d.data))}${field('Lender',d.lender)}${field('Tipo',d.deal_type)}${field('GPS',d.gps_required)}${field('Parcelado',d.parcelado)}</div>`)}${sec('Status operacionais',`<div class="status-grid">${STATUS_FIELDS.map(f=>`<div class="field"><div class="field-label">${statusLabel(f)}</div>${detailStatus(d,f)}</div>`).join('')}</div>`)}${sec('DMV / Registro',renderDmvSection(d))}${sec('DMV Returned / Protocol',renderDmvReturnSection(d))}${sec('Alertas ativos',renderAlerts(detailState.alerts))}${sec('Documentos',renderDocs(detailState.documents))}${sec('Internal Notes',renderNotes(detailState.notes))}${sec('Histórico',renderHistory(detailState.history))}`}function sec(t,c){return`<div class="detail-section"><div class="section-title">${esc(t)}</div>${c}</div>`}function field(l,v){return`<div class="field"><div class="field-label">${esc(l)}</div><div class="field-value">${esc(v||'—')}</div></div>`}function dmvField(l,v,formatter){if(v===undefined||v===null||String(v).trim()==='')return'';const shown=formatter?formatter(v):v;if(!shown||shown==='—')return'';return field(l,shown)}function renderDmvSection(d){return`<div class="detail-grid">${dmvField('DMV Owner',d.dmv_owner)}${dmvField('Despachante',d.dmv_dispatcher)}${dmvField('Data enviada',d.dmv_sent_date,fmtDate)}${dmvField('Due Date DMV',d.dmv_due_date,fmtDate)}${dmvField('Último follow-up',d.dmv_last_followup_at,fmtDateTime)}${Number(d.dmv_followup_count||0)>0?field('Follow-ups',d.dmv_followup_count):''}${dmvField('SLA Status',d.dmv_sla_status,dmvSlaLabel)}</div><div class="detail-grid" style="margin-top:10px"><label>DMV Owner${dmvOwnerSelect(d.dmv_owner)}</label><label>Despachante${dmvDispatcherSelect(d.dmv_dispatcher)}</label><label>Data enviada<input class="input" type="date" id="dmvSentDateInput" value="${dateInput(d.dmv_sent_date)}"></label><div><button class="btn primary" onclick="saveDmvInfo()">Salvar DMV</button></div></div><div class="quick-actions"><button class="quick-btn" onclick="registerDmvFollowup()">Registrar follow-up DMV</button><button class="quick-btn" onclick="recalculateDealHealth()">Atualizar / Recalcular Health</button></div>`}function renderDmvReturnSection(d){const r=currentReturn();return`<div class="doc-summary"><span class="badge ${d.dmv_return_status==='received'?'pending':'ok'}">Return: ${esc(d.dmv_return_status||'not_received')}</span><span class="badge ${d.protocol_status==='signed'?'ok':'pending'}">Protocol: ${esc(d.protocol_status||'not_generated')}</span>${d.plate_number?`<span class="badge">Plate ${esc(d.plate_number)}</span>`:''}</div><input type="hidden" id="retReturnId" value="${attr(r.return_id||'')}"><div class="return-checks"><label><input type="checkbox" id="retFinalPlate" ${checked(r.final_plate)}> Final Plate</label><label><input type="checkbox" id="retRegistration" ${checked(r.registration)}> Registration</label><label><input type="checkbox" id="retCot" ${checked(r.certificate_of_title)}> Certificate of Title</label><label><input type="checkbox" id="retTitle" ${checked(r.title)}> Title</label></div><div class="return-grid"><label>Other<input class="input" id="retOther" value="${attr(r.other_description||'')}"></label><label>Plate Number<input class="input" id="retPlate" value="${attr(r.plate_number||d.plate_number||'')}"></label><label>Returned Date<input class="input" type="date" id="retDate" value="${dateInput(r.returned_date)||todayIso()}"></label><label>Returned By<input class="input" id="retBy" value="${attr(r.returned_by||'')}"></label><label>Protocol Status<select class="input" id="retProtocol"><option value="pending_signature" ${sel(r.protocol_status,'pending_signature')}>Pending signature</option><option value="signed" ${sel(r.protocol_status,'signed')}>Signed</option><option value="canceled" ${sel(r.protocol_status,'canceled')}>Canceled</option></select></label><label>Omnia OATA Pending<select class="input" id="retOata"><option value="yes" ${sel(r.omnia_oata_pending,'yes')}>Yes</option><option value="no" ${sel(r.omnia_oata_pending,'no')}>No</option></select></label><label>Omnia Dispatcher Pending<select class="input" id="retDispatcherPending"><option value="yes" ${sel(r.omnia_dispatcher_pending,'yes')}>Yes</option><option value="no" ${sel(r.omnia_dispatcher_pending,'no')}>No</option></select></label></div><div class="quick-actions"><button class="btn primary" onclick="saveDmvReturn()">Save DMV Return</button><button class="quick-btn" onclick="generateProtocol()">Generate Protocol</button><button class="quick-btn" onclick="generateWhatsapp()">Generate WhatsApp Message</button><button class="quick-btn" onclick="markProtocolSigned()">Mark Protocol Signed</button></div><div id="whatsappBox">${r.whatsapp_message?`<div class="whatsapp-box">${esc(r.whatsapp_message)}</div><div class="quick-actions"><button class="quick-btn" onclick="copyWhatsapp()">Copy WhatsApp Message</button></div>`:''}</div>`}function currentReturn(){return(detailState.returns&&detailState.returns[0])||{protocol_status:'pending_signature',omnia_oata_pending:'yes',omnia_dispatcher_pending:'yes'}}function checked(v){return ['true','yes','1',true].includes(v)?'checked':''}function sel(a,b){return String(a||'')===b?'selected':''}function collectReturnPayload(){return{action:'saveDmvReturn',deal_id:detailState.id,return_id:retReturnId.value,final_plate:retFinalPlate.checked,registration:retRegistration.checked,certificate_of_title:retCot.checked,title:retTitle.checked,other_description:retOther.value,plate_number:retPlate.value,returned_date:retDate.value,returned_by:retBy.value,protocol_status:retProtocol.value,omnia_oata_pending:retOata.value,omnia_dispatcher_pending:retDispatcherPending.value}}async function saveDmvReturn(){const r=await post(collectReturnPayload());if(!r.success){toast('Erro ao salvar DMV Return');return}detailState.returns=[r.dmv_return];Object.assign(detailState.deal,{dmv_return_status:'received',protocol_status:r.dmv_return.protocol_status,plate_number:r.dmv_return.plate_number});if(r.health)detailState.health=r.health;if(r.next_actions)detailState.actions=r.next_actions;renderDealDetails();renderTable();toast('DMV Return salvo!')}async function generateProtocol(){if(!detailState.returns.length)await saveDmvReturn();const ret=currentReturn();const r=await fetchJson(`action=generateProtocolData&deal_id=${encodeURIComponent(detailState.id)}&return_id=${encodeURIComponent(ret.return_id||'')}`);if(!r.success){toast('Erro ao gerar protocolo');return}openProtocolPrint(r.protocol);await openDealDetails(detailState.id)}function openProtocolPrint(p){const d=p.deal||{},r=p.return||{},docs=(p.documents||[]).map(x=>`<label><input type="checkbox" checked> ${esc(x)}</label>`).join('');const html=`<!doctype html><html><head><title>PROTOCOL</title><style>body{font-family:Arial;margin:18px;color:#111}.wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}.protocol{border:2px solid #111;padding:14px;min-height:430px}.title{text-align:center;font-size:24px;font-weight:800;margin-bottom:12px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}.line{border-bottom:1px solid #111;min-height:24px;margin:8px 0}.meta{font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.sign{margin-top:34px}.small{font-size:12px}@media print{body{margin:8mm}.protocol{break-inside:avoid}.wrap{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="protocol"><div class="title">PROTOCOL</div><div class="small">Date</div><div class="line">${fmtDate(r.returned_date)}</div><div class="small">To / Customer</div><div class="line">${esc(d.customer_name||'')}</div><div class="checks">${docs}</div><div class="meta"><div><b>Car:</b> ${esc(d.vehicle||'')}</div><div><b>VIN:</b> ${esc(d.vin||'')}</div><div><b>Plate:</b> ${esc(r.plate_number||'')}</div><div><b>Deal Date:</b> ${fmtDate(d.sale_date)}</div><div><b>Deal:</b> ${esc(d.deal_id||'')}</div><div><b>Responsible:</b> ${esc(r.returned_by||'')}</div></div><div class="sign"><div class="small">Customer signature</div><div class="line"></div></div></div></div><script>window.print()<\/script></body></html>`;const w=window.open('','_blank');w.document.write(html);w.document.close()}async function generateWhatsapp(){if(!detailState.returns.length)await saveDmvReturn();const ret=currentReturn();const r=await fetchJson(`action=generateWhatsappMessage&deal_id=${encodeURIComponent(detailState.id)}&return_id=${encodeURIComponent(ret.return_id||'')}`);if(!r.success){toast('Erro ao gerar WhatsApp');return}detailState.returns=[{...ret,whatsapp_message:r.message}];whatsappBox.innerHTML=`<div class="whatsapp-box">${esc(r.message)}</div><div class="quick-actions"><button class="quick-btn" onclick="copyWhatsapp()">Copy WhatsApp Message</button></div>`;toast('Mensagem gerada!')}function copyWhatsapp(){const msg=(currentReturn().whatsapp_message||document.querySelector('.whatsapp-box')?.textContent||'');navigator.clipboard&&navigator.clipboard.writeText(msg);toast('Mensagem copiada!')}async function markProtocolSigned(){if(!detailState.returns.length)await saveDmvReturn();const ret=currentReturn();const r=await post({action:'markProtocolSigned',deal_id:detailState.id,return_id:ret.return_id});if(!r.success){toast('Erro ao marcar assinatura');return}Object.assign(detailState.deal,{protocol_status:'signed',protocol_signed_at:r.protocol_signed_at,dmv_return_status:'ready_for_pickup'});if(detailState.returns[0])Object.assign(detailState.returns[0],{protocol_status:'signed',protocol_signed_at:r.protocol_signed_at});if(r.health)detailState.health=r.health;if(r.next_actions)detailState.actions=r.next_actions;renderDealDetails();toast('Protocolo assinado!')}function dmvOwnerSelect(value){return`<select class="input" id="dmvOwnerSelect">${selectOptions([['','Sem responsável atribuído'],...dmvConfig.users.map(u=>[u.name||u.id,u.name||u.id])],value)}</select>`}function dmvDispatcherSelect(value){return`<select class="input" id="dmvDispatcherSelect">${selectOptions([['','Sem despachante atribuído'],...dmvConfig.dispatchers.map(d=>[d.name||d.id,d.name||d.id])],value)}</select>`}function selectOptions(opts,value){const cur=String(value||''),seen={};const out=opts.filter(([v])=>{v=String(v||'');if(seen[v])return false;seen[v]=true;return true});if(cur&&!out.some(([v])=>String(v||'')===cur))out.push([cur,cur]);return out.map(([v,l])=>`<option value="${attr(v)}" ${String(v||'')===cur?'selected':''}>${esc(l||v||'')}</option>`).join('')}async function saveDmvInfo(){if(!detailState.id)return;const dispatcher=dmvDispatcherSelect.value;if(String(detailState.deal.dmv_status||'').toLowerCase()==='with_dispatcher'&&!dispatcher){toast('Selecione o despachante antes de salvar.');return}const payload={action:'updateDmvInfo',deal_id:detailState.id,dmv_owner:dmvOwnerSelect.value,dmv_dispatcher:dispatcher,dmv_sent_date:dmvSentDateInput.value};const r=await post(payload);if(!r.success){toast('Erro ao salvar DMV');return}Object.assign(detailState.deal,r.dmv||payload);if(dispatcher&&!isFinalDmvStatus(detailState.deal.dmv_status))detailState.deal.dmv_status='with_dispatcher';if(r.health)detailState.health=r.health;if(r.next_actions)detailState.actions=r.next_actions;renderTable();renderDealDetails();toast('DMV atualizado!')}async function registerDmvFollowup(){const r=await post({action:'registerDmvFollowup',deal_id:detailState.id});if(!r.success){toast('Erro no follow-up DMV');return}Object.assign(detailState.deal,r.dmv||{});if(r.health)detailState.health=r.health;if(r.next_actions)detailState.actions=r.next_actions;detailState.history=[{action:'dmv_followup',notes:'Follow-up DMV registrado',timestamp:new Date().toISOString()},...detailState.history];renderTable();renderDealDetails();toast('Follow-up DMV registrado!')}async function recalculateDealHealth(){const r=await post({action:'syncDealHealth',deal_id:detailState.id});if(!r.success){toast('Erro ao recalcular Health');return}await openDealDetails(detailState.id);toast('Health recalculado!')}function detailStatus(d,f){const v=d[f]||'',opts=[['','—'],...(STATUS_CONFIG[f]||[])];if(v&&!opts.some(o=>o[0]===v))opts.push([v,v]);return`<select class="status-select ${tone(v)}" onchange="setDetailStatus('${js(d.id)}','${f}',this)">${opts.map(o=>`<option value="${attr(o[0])}" ${v===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`}async function setDetailStatus(id,f,sel){const d=detailState.deal,old=d[f]||'';if(f==='dmv_status'&&sel.value==='with_dispatcher'&&!d.dmv_dispatcher){sel.value=old;toast('Selecione o despachante antes de salvar.');renderDealDetails();return}d[f]=sel.value;const r=await post({action:'updateStatus',deal_id:id,field:f,value:sel.value});if(!r.success){d[f]=old;toast('Erro ao salvar')}else{if(r.health)detailState.health=r.health;if(r.next_actions)detailState.actions=r.next_actions;if(f==='dmv_status')setTimeout(()=>openDealDetails(id),50);toast('Status atualizado!')}renderTable();renderDealDetails()}function healthPanel(h){if(!h)return'';return`<div class="doc-summary"><span class="badge ${h.health_score==='critical'?'critical':h.health_score==='risk'?'orange':h.health_score==='attention'?'pending':'ok'}">HEALTH SCORE: ${h.health_score||'OK'}</span>${h.aging?`<span class="badge ${h.aging.tone}">Aging ${h.aging.days}d</span>`:''}${h.dmv_sla_status?`<span class="badge ${toneDmvSla(h.dmv_sla_status)}">DMV SLA: ${dmvSlaLabel(h.dmv_sla_status)}</span>`:''}${h.document_complete?'<span class="badge ok">Documentação Completa</span>':''}</div>`}function renderNextActions(a=[]){return a.length?`<div class="list">${a.map(x=>`<div class="action-item ${tone(x.priority)}"><div><span class="action-title">${esc(x.title||'Ação')}</span> <span class="badge ${tone(x.priority)}">${esc(x.priority||'medium')}</span></div><div class="action-desc">${esc(x.description||'')}</div><div class="action-meta"><span class="badge">${esc(x.category||'Operacional')}</span><span class="badge">Owner: ${esc(x.recommended_owner||'—')}</span></div></div>`).join('')}</div>`:'<div class="empty">Nenhuma ação recomendada.</div>'}function renderAlerts(a=[]){return a.length?`<div class="list">${a.map(x=>`<div class="item ${isCrit(x.priority)?'critical':''}"><div class="item-title">${esc(x.alert_type||'Alerta')}</div><div class="item-meta">Prioridade: ${esc(x.priority||'—')} · Status: ${esc(x.status||'—')} · Criado: ${fmtDateTime(x.created_at)}</div></div>`).join('')}</div>`:'<div class="empty">Nenhum alerta ativo.</div>'}function renderDocs(docs=[]){if(!docs.length)return'<div class="empty">Nenhum documento encontrado.</div>';const s=docSummary(docs);return`<div class="doc-summary"><span class="badge ok">${s.ok} OK</span><span class="badge pending">${s.pending} Pendentes</span><span class="badge critical">${s.critical} Críticos</span></div><div class="list">${docs.map((d,i)=>{const st=calcDoc(d.printed_status,d.dealer_center_status);return`<div class="item ${tone(st)}"><div class="item-title">${esc(d.document_name||'Documento')}</div><div class="doc-controls"><label>Printed${docSelect(i,'printed_status',d.printed_status)}</label><label>DealerCenter${docSelect(i,'dealer_center_status',d.dealer_center_status)}</label><span class="badge ${tone(st)}">${docLabel(st)}</span></div></div>`}).join('')}</div>`}function docSelect(i,f,v){v=v||'pending';return`<select class="status-select ${tone(v)}" onchange="setDocStatus(${i},'${f}',this)">${['pending','ok','missing'].map(x=>`<option value="${x}" ${v===x?'selected':''}>${docLabel(x)}</option>`).join('')}</select>`}async function setDocStatus(i,f,sel){const doc=detailState.documents[i],old=doc[f]||'pending';doc[f]=sel.value;doc.status=calcDoc(doc.printed_status,doc.dealer_center_status);renderDealDetails();const r=await post({action:'updateDocumentStatus',deal_id:detailState.id,document_name:doc.document_name,field:f,value:sel.value});if(!r.success){doc[f]=old;toast('Erro ao salvar documento')}else{if(r.document)detailState.documents[i]={...doc,...r.document};if(r.health)detailState.health=r.health;if(r.next_actions)detailState.actions=r.next_actions;toast('Documento atualizado!')}renderDealDetails()}function renderNotes(notes=[]){const list=notes.length?`<div class="list">${notes.map(n=>`<div class="item"><div class="item-title">${esc(n.note_text||'')}</div><div class="item-meta">Usuário: ${esc(n.user||'—')} · ${fmtDateTime(n.created_at)}</div></div>`).join('')}</div>`:'<div class="empty">Nenhuma nota interna registrada.</div>';return`<div class="note-box"><textarea id="internalNoteText" placeholder="Adicionar nota interna..."></textarea><button class="btn primary" onclick="addNote()">Adicionar nota</button></div>${list}`}async function addNote(){const text=internalNoteText?internalNoteText.value.trim():'';if(!text)return;const r=await post({action:'addDealNote',deal_id:detailState.id,note_text:text,note_type:'internal'});if(!r.success){toast('Erro ao salvar nota');return}detailState.notes=[r.note,...detailState.notes];renderDealDetails();toast('Nota adicionada!')}function renderHistory(h=[]){return h.length?`<div class="list">${h.map(x=>`<div class="item"><div class="item-title">${esc(x.action||'Evento')}</div><div class="item-meta">Usuário: ${esc(x.user||'—')} · ${fmtDateTime(x.timestamp)}</div><div class="item-meta">${esc(x.notes||'')}</div></div>`).join('')}</div>`:'<div class="empty">Nenhum evento registrado.</div>'}async function post(p){try{return await(await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(p)})).json()}catch(e){return{success:false,error:e.message}}}async function fetchJson(q){try{return await(await fetch(`${SCRIPT_URL}?${q}`)).json()}catch(e){return{success:false,error:e.message}}}function closeDealDetails(){detailOverlay.classList.add('hidden')}function outsideDetail(e){if(e.target===detailOverlay)closeDealDetails()}function updateStats(){const total=allDeals.length,comp=allDeals.filter(isDone).length,crit=allDeals.filter(d=>d.critical_alert_count>0).length;sTotal.textContent=total+' total';sComplete.textContent=comp+' completos';sPending.textContent=(total-comp)+' pendentes';sCritical.textContent=crit+' críticos'}function agingInfo(d){if(String(d.dmv_status||'').toLowerCase()==='done')return null;const sale=dateVal(d.data);if(!sale)return null;const today=new Date(),a=new Date(sale.getFullYear(),sale.getMonth(),sale.getDate()),b=new Date(today.getFullYear(),today.getMonth(),today.getDate()),days=Math.max(0,Math.floor((b-a)/86400000));return{days,tone:days<=21?'green':days<=45?'yellow':days<=60?'orange':'red'}}function agingBadge(d){const a=agingInfo(d);return a?`<span class="aging-badge ${a.tone}">${a.days}d</span>`:'<span class="aging-badge">—</span>'}function alertBadge(d){const c=d.alert_count||0,cr=d.critical_alert_count||0;return`<span class="alert-badge ${cr?'critical':c?'pending':''}">${cr?`${cr} crítico / ${c}`:c}</span>`}function dateVal(v){if(!v)return null;if(v instanceof Date)return isNaN(v)?null:v;if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400*1000));return isNaN(d)?null:d}const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],12);m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return new Date(+m[3],+m[1]-1,+m[2],12);const d=new Date(s);return isNaN(d)?null:d}function fmtDate(v){const d=dateVal(v);return d?d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}):'—'}function fmtDateTime(v){const d=dateVal(v)||new Date(String(v||''));return isNaN(d)?'—':d.toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}function dateInput(v){const d=dateVal(v);return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:''}function todayIso(){return new Date().toISOString().split('T')[0]}function completeStatus(v){return['approved','paid','sent','done','created','received','electronic','not_needed'].includes(String(v||'').toLowerCase())}function isDone(d){return String(d.dmv_status||'').toLowerCase()==='done'||String(d.hub_status||'').toLowerCase()==='completed'}function isFinalDmvStatus(v){return['done','rejected','resubmission_needed'].includes(String(v||'').toLowerCase())}function calcDoc(p,d){p=String(p||'pending').toLowerCase();d=String(d||'pending').toLowerCase();if(p==='missing'||d==='missing')return'critical';if(p==='ok'&&d==='ok')return'ok';return'pending'}function docSummary(d){return d.reduce((a,x)=>{a[calcDoc(x.printed_status,x.dealer_center_status)]++;return a},{ok:0,pending:0,critical:0})}function docLabel(v){return{ok:'OK',pending:'Pendente',missing:'Missing',critical:'Crítico'}[String(v||'').toLowerCase()]||v||'—'}function toneDmvSla(v){return{not_started:'pending',on_track:'ok',due_today:'pending',overdue:'critical',escalated:'critical',completed:'ok'}[String(v||'').toLowerCase()]||'pending'}function dmvSlaLabel(v){return{not_started:'Não iniciado',on_track:'No prazo',due_today:'Vence hoje',overdue:'Atrasado',escalated:'Escalado',completed:'Concluído'}[String(v||'').toLowerCase()]||v||'—'}function statusLabel(f){return{review_status:'Review',commission_status:'Comissão',dmv_status:'DMV',parcelamento_status:'Parcelamento',title_status:'Title',omnia_status:'OMNIA',folder_status:'Folder',envelope_status:'Envelope'}[f]||f}function n(v){return v===undefined||v===null||v===''?'0':String(v)}function pct(v){return n(v)+'%'}function tone(p){return TONES[String(p||'').toLowerCase()]||{critical:'critical',high:'high',medium:'medium',low:'ok',ok:'ok',pending:'pending',missing:'critical'}[String(p||'').toLowerCase()]||'pending'}function isCrit(v){return['critical','critico','crítico','high','alta'].includes(String(v||'').toLowerCase())}function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function attr(v){return esc(v).replace(/\n/g,'&#10;')}function js(v){return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function toast(m){toastEl.textContent=m;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800)}const toastEl=document.getElementById('toast');switchView('home');Promise.all([loadDmvConfig(),loadFromSheets(),loadDashboard()]);</script></body></html>
