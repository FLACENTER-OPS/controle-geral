<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Controle Geral - Florida Auto Center</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><style>:root{--bg:#0a0d12;--surface:#111520;--card:#161c2a;--border:#1e2840;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--orange:#fb923c;--text:#e2e8f0;--muted:#64748b;--dim:#94a3b8;--gg:rgba(16,185,129,.12);--rg:rgba(239,68,68,.12);--ag:rgba(245,158,11,.12)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}.header,.nav,.toolbar{background:var(--surface);border-bottom:1px solid var(--border)}.header{padding:16px 20px;position:sticky;top:0;z-index:10}.header-inner{display:flex;align-items:center;gap:12px}.logo{width:30px;height:30px;border-radius:7px;background:var(--green);color:#081016;display:grid;place-items:center;font-weight:800}.title{font-size:14px;font-weight:700}.sub{font:10px 'DM Mono';color:var(--muted)}.stats{margin-left:auto;display:flex;gap:8px}.chip,.badge,.aging-badge,.alert-badge,.doc-chip,.action-badge{border:1px solid var(--border);border-radius:20px;padding:3px 8px;font:10px 'DM Mono';color:var(--muted);display:inline-flex;align-items:center;gap:4px}.green,.ok{color:var(--green)!important;border-color:rgba(16,185,129,.45)!important;background:var(--gg)!important}.amber,.yellow,.pending,.medium{color:var(--amber)!important;border-color:rgba(245,158,11,.45)!important;background:var(--ag)!important}.red,.critical,.high{color:var(--red)!important;border-color:rgba(239,68,68,.45)!important;background:var(--rg)!important}.orange{color:var(--orange)!important;border-color:rgba(249,115,22,.5)!important;background:rgba(249,115,22,.12)!important}.nav{display:flex;gap:8px;padding:10px 20px}.nav button,.filter-btn,.quick-btn,.detail-edit{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:12px;padding:8px 12px;cursor:pointer}.nav button.active,.nav button:hover,.filter-btn.active,.filter-btn:hover,.quick-btn:hover{border-color:var(--blue);color:var(--blue)}.view.hidden{display:none}.home{padding:18px 20px 36px}.home-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}.home-title{font-size:20px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card,.panel{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:13px;min-width:0}.card{cursor:pointer;text-align:left}.card:hover{border-color:var(--blue)}.label,.section-title{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.value{font-size:29px;font-weight:800;margin-top:7px}.section{margin-top:18px}.section-title{margin-bottom:10px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:8px 0;font-size:12px}.metric:last-child{border-bottom:0}.metric span{color:var(--muted)}.bar-row{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;font-size:11px;color:var(--muted);margin:8px 0}.bar{height:8px;background:var(--surface);border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:20px}.toolbar{padding:12px 20px;display:flex;gap:10px;overflow-x:auto}.btn-add{background:#2563eb;color:white;border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer}.search{background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 12px;width:210px}.table-wrap{padding:16px 20px;overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1280px}th{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--card);padding:10px;text-align:left;border-bottom:2px solid var(--border)}td{font-size:12px;padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}tbody tr:hover{background:rgba(255,255,255,.03)}.center{text-align:center}.muted{color:var(--muted);font:11px 'DM Mono'}.deal-link{background:none;border:0;color:var(--blue);font:12px 'DM Mono';cursor:pointer}.status-select{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;padding:5px;max-width:132px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;justify-content:flex-end}.overlay.hidden{display:none}.detail{width:min(620px,100%);height:100vh;overflow:auto;background:var(--surface);border-left:1px solid var(--border);padding:22px}.modal{align-items:flex-end;justify-content:center}.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:8px 8px 0 0;padding:22px;width:min(620px,100%)}.close{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}.detail-header{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}.detail-title{font-size:18px;font-weight:800}.detail-sub{color:var(--muted);font:12px 'DM Mono'}.detail-section{border-top:1px solid var(--border);padding-top:16px;margin-top:16px}.detail-grid,.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field,.status-row,.item,.action-item{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px}.field-label{font-size:10px;color:var(--muted);text-transform:uppercase}.field-value{font-size:13px;margin-top:5px;overflow:hidden;text-overflow:ellipsis}.status-row{display:flex;justify-content:space-between;align-items:center}.list{display:flex;flex-direction:column;gap:8px}.item-title,.action-title{font-size:13px;font-weight:800}.item-meta,.action-desc{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px}.action-top{display:flex;justify-content:space-between;gap:8px}.action-meta,.quick-actions,.doc-summary,.admin-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.doc-controls{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px;align-items:end}.note-box{display:grid;grid-template-columns:1fr auto;gap:8px}.input,textarea,select{font-family:inherit}.input,textarea{background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px}textarea{min-height:70px}.save{background:var(--green);border:0;border-radius:6px;color:#fff;padding:10px 12px;font-weight:700;cursor:pointer}.empty,.loading{border:1px dashed var(--border);border-radius:6px;padding:20px;text-align:center;color:var(--muted);font-size:13px}.admin-status{font-size:12px;color:var(--muted);margin-top:10px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:10px 18px;border-radius:8px;display:none;z-index:80}.toast.show{display:block}@media(max-width:900px){.grid,.panels,.detail-grid,.status-grid,.doc-controls{grid-template-columns:1fr}.stats{display:none}}</style></head><body><div class="header"><div class="header-inner"><div class="logo">FA</div><div><div class="title">Controle Geral de Vendas</div><div class="sub">Florida Auto Center · DEAL_MASTER</div></div><div class="stats"><span class="chip green" id="s-complete">0 completos</span><span class="chip amber" id="s-pending">0 pendentes</span><span class="chip red" id="s-critical">0 críticos</span><span class="chip" id="s-total">0 total</span></div></div></div><div class="nav"><button id="navHome" class="active" onclick="switchView('home')">Home</button><button id="navDeals" onclick="switchView('deals')">Deals</button></div><main id="homeView" class="view home"><div class="loading">Carregando dashboard operacional...</div></main><main id="dealsView" class="view hidden"><div class="toolbar"><button class="btn-add" onclick="openModal()">+ Novo Deal</button><input class="search" placeholder="Buscar deal, VIN, vendedor..." oninput="filterDeals(this.value)"><button class="filter-btn active" onclick="setFilter('ativos',this)">Ativos</button><button class="filter-btn" onclick="setFilter('pendentes',this)">Pendentes</button><button class="filter-btn" onclick="setFilter('aprovados',this)">Completos</button><button class="filter-btn" onclick="setFilter('arquivados',this)">Arquivados</button><button class="filter-btn" onclick="setFilter('sem-pg',this)">Comissão pendente</button><button class="filter-btn" onclick="setFilter('alertas',this)">Com alertas</button><button class="filter-btn" onclick="setFilter('todos',this)">Todos</button></div><div class="table-wrap"><table><thead><tr><th>Data</th><th class="center">Aging</th><th>Deal</th><th>Veículo / Vendedor</th><th class="center">Review</th><th class="center">Comissão</th><th class="center">DMV</th><th class="center">Parcelamento</th><th class="center">Title</th><th class="center">OMNIA</th><th class="center">Folder</th><th class="center">Envelope</th><th class="center">Alertas</th><th>Lender</th><th>Tipo</th><th>GPS</th><th>Ações</th></tr></thead><tbody id="tableBody"><tr><td colspan="17" class="empty">Carregando...</td></tr></tbody></table></div></main><div id="detailOverlay" class="overlay hidden" onclick="outsideDetail(event)"><aside class="detail"><div id="detailContent"></div></aside></div><div id="modalOverlay" class="overlay modal hidden" onclick="outsideModal(event)"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><h3>Novo Deal</h3><div class="detail-grid" style="margin-top:12px"><input class="input" id="f-data" type="date"><input class="input" id="f-deal" placeholder="Deal ID"><input class="input" id="f-vin" placeholder="VIN"><input class="input" id="f-veiculo" placeholder="Veículo"><input class="input" id="f-vendedor" placeholder="Vendedor"><select class="input" id="f-gps"><option value="nao">Não tem GPS</option><option value="sim">GPS obrigatório</option><option value="financeira">Financeira</option><option value="flacenter">FlaCenter</option></select></div><button class="save" style="margin-top:12px;width:100%" onclick="saveDeal()">Salvar deal</button></div></div><div class="toast" id="toast">Salvo!</div><script>const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzKONEy9LywAzjGqmtmdUDodSDK7oLySpAIRjoi6KpG6txCb-VT9T6zYJ-Zgx4IcUda/exec';const STATUS_FIELDS=['review_status','commission_status','dmv_status','parcelamento_status','title_status','omnia_status','folder_status','envelope_status'];const STATUS_CONFIG={review_status:[['pending','Pendente'],['approved','Aprovado'],['rejected','Rejeitado']],commission_status:[['pending','Pendente'],['blocked','Bloqueada'],['approved','Aprovada'],['paid','Paga']],dmv_status:[['pending','Pendente'],['sent','Enviado'],['done','Concluído']],parcelamento_status:[['not_needed','Não se aplica'],['pending','Pendente'],['created','Criado']],title_status:[['missing','Ausente'],['electronic','Eletrônico'],['received','Recebido']],omnia_status:[['pending','Pendente'],['done','Feito']],folder_status:[['pending','Pendente'],['done','Feito']],envelope_status:[['pending','Pendente'],['done','Feito']]};const TONES={pending:'pending',blocked:'critical',rejected:'critical',missing:'critical',approved:'ok',paid:'ok',sent:'ok',done:'ok',created:'ok',received:'ok',electronic:'ok',not_needed:'ok'};let allDeals=[],currentFilter='ativos',searchTerm='',detailState={id:null,deal:null,alerts:[],history:[],documents:[],notes:[],actions:[],health:null,loading:false};function switchView(v){homeView.classList.toggle('hidden',v!=='home');dealsView.classList.toggle('hidden',v!=='deals');navHome.classList.toggle('active',v==='home');navDeals.classList.toggle('active',v==='deals')}async function loadFromSheets(){try{const data=await(await fetch(`${SCRIPT_URL}?source=DEAL_MASTER`)).json();if(!data.success)throw Error(data.error||'Erro');allDeals=(data.deals||[]).map(normalizeDeal);renderTable()}catch(e){tableBody.innerHTML=`<tr><td colspan="17" class="empty">Erro ao carregar DEAL_MASTER.</td></tr>`}}async function loadDashboard(){try{const data=await(await fetch(`${SCRIPT_URL}?action=getDashboardMetrics`)).json();renderDashboard(data.success?data:{})}catch(e){renderDashboard({})}}function normalizeDeal(d={}){const id=d.deal_id||d.dealId||d.id||'';return{...d,id:String(id),deal_id:String(id),dealId:String(id),data:d.sale_date||d.data||'',veiculo:d.vehicle||d.veiculo||'',vendedor:d.seller||d.vendedor||'',alerts:d.alerts||[],alert_count:Number(d.alert_count||(d.alerts||[]).length||0),critical_alert_count:Number(d.critical_alert_count||0),hub_status:d.hub_status||(d.dmv_status==='done'?'completed':'active'),review_status:d.review_status||'pending',commission_status:d.commission_status||'pending',dmv_status:d.dmv_status||'pending',parcelamento_status:d.parcelamento_status||'',title_status:d.title_status||'',omnia_status:d.omnia_status||'',folder_status:d.folder_status||'',envelope_status:d.envelope_status||''}}function renderDashboard(d){const s=d.summary||{},h=d.health||{},sla=d.sla||{},a=d.alerts||{},doc=d.documents||{},dmv=d.dmv||{},p=d.parcelamentos||{},c=d.commission||{},ch=d.charts||{},ac=d.actionCenter||{};homeView.innerHTML=`<div class="home-head"><div><div class="home-title">Home Operacional</div><div class="sub">Visão executiva diária · Action Center</div></div><button class="filter-btn" onclick="loadDashboard()">Atualizar</button></div><div class="grid">${card('Deals Ativos',s.activeDeals,'green','ativos')}${card('Deals Críticos',s.criticalDeals,'red','alertas')}${card('DMV Pendentes',s.dmvPending,'amber','dmv-pending')}${card('Parcelamentos Pendentes',s.parcelamentosPending,'red','parcelamento-pending')}${card('Documentos Críticos',s.criticalDocuments,'red','docs-critical')}${card('Aging 60+',s.aging60,'red','aging-60')}${card('Comissão Pendente',s.commissionPending,'amber','sem-pg')}${card('Deals Completos',s.completedDeals,'green','aprovados')}</div>${section('Action Center',actionCenter(ac))}${section('Automações / Modo Teste',notificationAdmin())}${section('System Health',`<div class="panels">${metrics('Health',[['Saudáveis',pct(h.okPercent)],['Atenção',pct(h.attentionPercent)],['Críticos',pct(h.criticalPercent)],['Alertas abertos',n(h.openAlerts)]])}${bars('Deals por health score',ch.healthScore||[])}${bars('Aging distribution',ch.agingDistribution||[])}</div>`)}${section('SLA Operacional',`<div class="panels">${metrics('SLA',[['Aging médio ativos',days(sla.activeAverageAging)],['Conclusão média',days(sla.completedAverageDays)],['Acima de 60 dias',n(sla.over60)]])}${metrics('Faixas',[['0-21 OK',n((sla.ranges||{}).ok)],['22-45 Atenção',n((sla.ranges||{}).attention)],['46-60 Risco',n((sla.ranges||{}).risk)],['60+ Crítico',n((sla.ranges||{}).critical)]])}${bars('Distribuição SLA',rangePairs(sla.ranges||{}))}</div>`)}${section('Alertas',`<div class="panels">${bars('Por tipo',a.byType||[])}${bars('Por prioridade',a.byPriority||[])}${list('Top 5 urgentes',(a.topUrgent||[]).map(x=>({title:`${x.deal_id||'—'} · ${x.alert_type||'Alerta'}`,meta:`${x.priority||'—'} · ${x.seller||'Sem vendedor'}`})))}</div>`)}${section('Documentação',`<div class="panels">${metrics('Documentos',[['OK',n(doc.ok)],['Pendentes',n(doc.pending)],['Críticos',n(doc.critical)],['Completa',pct(doc.completePercent)]])}${bars('Top pendências',doc.topPending||[])}${bars('Alertas por tipo',ch.alertsByType||[])}</div>`)}${section('DMV / Registro',`<div class="panels">${metrics('DMV',[['Pending',n(dmv.pending)],['Sent',n(dmv.sent)],['Done',n(dmv.done)],['Pending >21d',n(dmv.pendingOver21)],['Pending >45d',n(dmv.pendingOver45)],['Pending >60d',n(dmv.pendingOver60)]])}${bars('DMV overview',ch.dmvStatus||[])}${bars('Pendências por vendedor',ch.sellerPending||[])}</div>`)}${section('Parcelamentos',`<div class="panels">${metrics('Parcelamentos',[['Parcelado = sim',n(p.parceladoSim)],['Pending',n(p.pending)],['Created',n(p.created)],['Not needed',n(p.not_needed)],['Críticos',n(p.critical)]])}</div>`)}${section('Comissão',`<div class="panels">${metrics('Comissão',[['Pending',n(c.pending)],['Blocked',n(c.blocked)],['Approved',n(c.approved)],['Paid',n(c.paid)]])}${metrics('Destaques',[['Pending em deal crítico',n(c.pendingCriticalDeal)],['Approved c/ doc crítico',n(c.approvedCriticalDocs)],['Paid c/ alerta crítico',n(c.paidCriticalAlert)]])}</div>`)}${section('Leaderboard por Vendedor',leader(d.sellerLeaderboard||[]))}`}function card(t,v,tone,f){return`<button class="card ${tone}" onclick="goFilter('${f}')"><div class="label">${esc(t)}</div><div class="value">${n(v)}</div></button>`}function goFilter(f){switchView('deals');setFilter(f)}function section(t,c){return`<div class="section"><div class="section-title">${esc(t)}</div>${c}</div>`}function metrics(t,rows){return`<div class="panel"><div class="section-title">${esc(t)}</div>${rows.map(r=>`<div class="metric"><span>${esc(r[0])}</span><strong>${esc(r[1])}</strong></div>`).join('')}</div>`}function bars(t,items){const max=Math.max(...items.map(i=>Number(i.value)||0),1);return`<div class="panel"><div class="section-title">${esc(t)}</div>${items.length?items.map(i=>`<div class="bar-row"><span title="${attr(i.label||'—')}">${esc(short(i.label||'—'))}</span><div class="bar"><i style="width:${Math.round((Number(i.value)||0)/max*100)}%"></i></div><strong>${n(i.value)}</strong></div>`).join(''):'<div class="empty">Sem dados</div>'}</div>`}function list(t,items){return`<div class="panel"><div class="section-title">${esc(t)}</div><div class="list">${items.length?items.map(i=>`<div class="item"><div class="item-title">${esc(i.title)}</div><div class="item-meta">${esc(i.meta||'')}</div></div>`).join(''):'<div class="empty">Sem dados</div>'}</div></div>`}function actionCenter(ac){const c=ac.counters||{};return`<div class="panels">${metrics('Contadores',[['Ações abertas',n(c.open)],['Críticas',n(c.critical)],['Altas',n(c.high)],['Médias',n(c.medium)],['Resolvidas',n(c.resolved)]])}${list('Top prioridades do dia',(ac.topPriorities||[]).slice(0,5).map(ai))}${list('Aging crítico',(ac.agingCritical||[]).slice(0,5).map(ai))}</div>`}function notificationAdmin(){return`<div class="panel"><div class="admin-actions"><button class="filter-btn" onclick="runAutomation('sendTestTelegramNotification')">Enviar teste Telegram</button><button class="filter-btn" onclick="runAutomation('sendDailyDigest')">Enviar digest diário</button><button class="filter-btn" onclick="runAutomation('processNotificationReminders')">Processar lembretes</button></div><div class="admin-status" id="notificationStatus">Modo teste ativo. Tokens e chat id ficam somente nas Script Properties.</div></div>`}async function runAutomation(action){const el=document.getElementById('notificationStatus');if(el)el.textContent='Executando...';try{const r=await(await fetch(`${SCRIPT_URL}?action=${encodeURIComponent(action)}`)).json();if(!r.success)throw Error(r.error||'Erro');if(el)el.textContent=action==='processNotificationReminders'?`Lembretes processados: ${n(r.reminders_sent)} enviados.`:action==='sendDailyDigest'?'Digest diário enviado em modo teste.':'Teste Telegram enviado com sucesso.';toast('Automação executada!');if(action!=='sendTestTelegramNotification')loadDashboard()}catch(e){if(el)el.textContent='Erro: '+(e.message||'falha');toast('Erro na automação')}}function ai(a){return{title:`${a.deal_id||'—'} · ${a.title||'Ação'}`,meta:`${a.priority||'—'} · ${a.category||'Operacional'} · ${a.recommended_owner||'—'}`}}function leader(items){return`<div class="panel"><table style="min-width:0"><thead><tr><th>Vendedor</th><th>Ativos</th><th>Alertas</th><th>Críticos</th><th>Aging</th><th>Docs críticos</th><th>Docs OK</th></tr></thead><tbody>${items.length?items.map(i=>`<tr><td>${esc(i.seller||'—')}</td><td>${n(i.activeDeals)}</td><td>${n(i.alerts)}</td><td>${n(i.criticalAlerts)}</td><td>${days(i.averageAging)}</td><td>${n(i.criticalDocuments)}</td><td>${pct(i.documentationCompletePercent)}</td></tr>`).join(''):'<tr><td colspan="7">Sem dados</td></tr>'}</tbody></table></div>`}function renderTable(){const rows=allDeals.filter(d=>{const q=searchTerm,m=!q||[d.dealId,d.vin,d.veiculo,d.vendedor,d.lender,d.deal_type].some(v=>String(v||'').toLowerCase().includes(q));return m&&matchFilter(d)});tableBody.innerHTML=rows.length?rows.map(row).join(''):`<tr><td colspan="17" class="empty">${allDeals.length?'Nenhum deal encontrado.':'Nenhum deal no DEAL_MASTER.'}</td></tr>`;updateStats()}function row(d){return`<tr><td class="muted">${fmtDate(d.data)}</td><td class="center">${agingBadge(d)}</td><td><button class="deal-link" onclick="openDealDetails('${js(d.id)}')">${esc(d.dealId||'—')}</button></td><td><strong>${esc(d.veiculo||'—')}</strong><div class="muted">${esc(d.vendedor||'—')}</div></td>${STATUS_FIELDS.map(f=>`<td class="center">${statusSelect(d,f)}</td>`).join('')}<td class="center">${alertBadge(d)}</td><td class="muted">${esc(d.lender||'—')}</td><td class="muted">${esc(d.deal_type||'—')}</td><td class="muted">${esc(d.gps_required||'—')}</td><td><button class="filter-btn" onclick="openDealDetails('${js(d.id)}')">Detalhes</button></td></tr>`}function matchFilter(d){const done=isDone(d),arch=String(d.hub_status||'').toLowerCase()==='archived',complete=STATUS_FIELDS.every(f=>completeStatus(d[f])),age=agingInfo(d);return currentFilter==='todos'||currentFilter==='ativos'&&!done&&!arch||currentFilter==='pendentes'&&!complete||currentFilter==='aprovados'&&done||currentFilter==='arquivados'&&arch||currentFilter==='sem-pg'&&!completeStatus(d.commission_status)||currentFilter==='alertas'&&d.alert_count>0||currentFilter==='dmv-pending'&&String(d.dmv_status||'').toLowerCase()==='pending'||currentFilter==='parcelamento-pending'&&['sim','yes','true'].includes(String(d.parcelado||'').toLowerCase())&&String(d.parcelamento_status||'').toLowerCase()!=='created'||currentFilter==='aging-60'&&age&&age.days>60||currentFilter==='docs-critical'&&d.critical_alert_count>0}function setFilter(f,b){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');renderTable()}function filterDeals(v){searchTerm=v.toLowerCase().trim();renderTable()}function statusSelect(d,f){const v=d[f]||'',opts=[['','—'],...(STATUS_CONFIG[f]||[])];if(v&&!opts.some(o=>o[0]===v))opts.push([v,v]);return`<select class="status-select ${TONES[v]||''}" onchange="setMasterStatus('${js(d.id)}','${f}',this)">${opts.map(o=>`<option value="${o[0]}" ${v===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`}async function setMasterStatus(id,field,sel){const d=allDeals.find(x=>x.id===id),old=d?d[field]:'';if(!d)return;d[field]=sel.value;if(field==='dmv_status')d.hub_status=sel.value==='done'?'completed':'active';const r=await post({action:'updateStatus',deal_id:id,field,value:sel.value});if(!r.success){d[field]=old;sel.value=old;toast('Erro ao salvar')}renderTable();if(detailState.id===id){if(r.health)detailState.health=r.health;if(r.next_actions)detailState.actions=r.next_actions;renderDealDetails()}else toast('Status atualizado!')}async function openDealDetails(id){const local=allDeals.find(d=>d.id===id)||null;detailState={id,deal:local,alerts:local?(local.alerts||[]):[],history:[],documents:[],notes:[],actions:[],health:null,loading:true};detailOverlay.classList.remove('hidden');renderDealDetails();try{const data=await(await fetch(`${SCRIPT_URL}?action=getDealDetails&deal_id=${encodeURIComponent(id)}`)).json();if(!data.success)throw Error(data.error||'Erro');const deal=normalizeDeal({...data.deal,alerts:data.alerts||[]}),idx=allDeals.findIndex(d=>d.id===deal.id);if(idx>=0)allDeals[idx]={...allDeals[idx],...deal};detailState={id,deal,alerts:data.alerts||[],history:data.history||[],documents:data.documents||[],notes:data.notes||[],actions:data.next_actions||[],health:data.health||null,loading:false}}catch(e){detailState={...detailState,loading:false,error:e.message}}renderDealDetails()}function renderDealDetails(){const el=detailContent,d=detailState.deal;if(detailState.loading&&!d){el.innerHTML='<button class="close" onclick="closeDealDetails()">×</button><div class="loading">Carregando detalhes...</div>';return}if(!d){el.innerHTML=`<button class="close" onclick="closeDealDetails()">×</button><div class="empty">${esc(detailState.error||'Deal não encontrado')}</div>`;return}el.innerHTML=`<div class="detail-header"><div><div class="detail-title">Deal ${esc(d.dealId||d.id||'—')}</div><div class="detail-sub">${esc(d.veiculo||'Veículo não informado')}</div></div><button class="close" onclick="closeDealDetails()">×</button></div>${healthPanel(detailState.health)}${detailState.error?`<div class="empty">${esc(detailState.error)}</div>`:''}${sec('Next Actions',renderNextActions(detailState.actions))}${sec('Informações gerais',`<div class="detail-grid">${field('Deal ID',d.deal_id||d.dealId)}${field('Veículo',d.vehicle||d.veiculo)}${field('Vendedor',d.seller||d.vendedor)}${field('Cliente',d.customer_name)}${field('Data',fmtDate(d.sale_date||d.data))}${field('Lender',d.lender)}${field('Tipo',d.deal_type)}${field('GPS',d.gps_required)}${field('Parcelado',d.parcelado)}</div>`)}${sec('Status operacionais',`<div class="status-grid">${STATUS_FIELDS.map(f=>`<div class="status-row"><span>${statusLabel(f)}</span>${detailStatus(d,f)}</div>`).join('')}</div>`)}${sec('Alertas ativos',renderAlerts(detailState.alerts))}${sec('Documentos',renderDocs(detailState.documents))}${sec('Internal Notes',renderNotes(detailState.notes))}${sec('Histórico',renderHistory(detailState.history))}`}function sec(t,c){return`<div class="detail-section"><div class="section-title">${esc(t)}</div>${c}</div>`}function field(l,v){return`<div class="field"><div class="field-label">${esc(l)}</div><div class="field-value">${esc(v||'—')}</div></div>`}function healthPanel(h){if(!h)return'';return`<div class="doc-summary"><span class="badge ${h.health_score==='critical'?'critical':h.health_score==='attention'?'pending':'ok'}">HEALTH SCORE: ${h.health_score||'OK'}</span>${h.aging?`<span class="badge ${h.aging.tone}">Aging ${h.aging.days}d</span>`:''}${h.document_complete?'<span class="badge ok">Documentação Completa</span>':''}</div>`}function renderNextActions(a=[]){if(!a.length)return'<div class="empty">Nenhuma ação recomendada.</div>';return`<div class="list">${a.map(x=>`<div class="action-item ${tone(x.priority)}"><div class="action-top"><div><span>${icon(x.category)}</span> <span class="action-title">${esc(x.title||'Ação')}</span></div><span class="action-badge ${tone(x.priority)}">${esc(x.priority||'medium')}</span></div><div class="action-desc">${esc(x.description||'')}</div><div class="action-meta"><span class="action-badge">${esc(x.category||'Operacional')}</span><span class="action-badge">Owner: ${esc(x.recommended_owner||'—')}</span>${x.sla_days!==''&&x.sla_days!=null?`<span class="action-badge ${x.is_overdue?'critical':''}">SLA ${x.sla_days}d</span>`:''}</div><div class="quick-actions"><button class="quick-btn" onclick="resolveAction('${js(x.action_id||'')}')">Marcar como resolvido</button><button class="quick-btn" onclick="focusNote('${js(x.title||'Ação')}')">Criar nota</button><button class="quick-btn" onclick="openDealDetails('${js(x.deal_id||detailState.id)}')">Abrir detalhes</button><button class="quick-btn" onclick="scrollDocs()">Ir para documentos</button></div></div>`).join('')}</div>`}function detailStatus(d,f){const v=d[f]||'',opts=[['','—'],...(STATUS_CONFIG[f]||[])];return`<select class="status-select ${TONES[v]||''}" onchange="setDetailStatus('${js(d.id)}','${f}',this)">${opts.map(o=>`<option value="${o[0]}" ${v===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`}async function setDetailStatus(id,f,sel){const d=detailState.deal,old=d[f]||'';d[f]=sel.value;const r=await post({action:'updateStatus',deal_id:id,field:f,value:sel.value});if(!r.success){d[f]=old;toast('Erro ao salvar')}else{if(r.health)detailState.health=r.health;if(r.next_actions)detailState.actions=r.next_actions;toast('Status atualizado!')}renderTable();renderDealDetails()}function renderAlerts(a=[]){return a.length?`<div class="list">${a.map(x=>`<div class="item ${isCrit(x.priority)?'critical':''}"><div class="item-title">${esc(x.alert_type||'Alerta')}</div><div class="item-meta">Prioridade: ${esc(x.priority||'—')} · Status: ${esc(x.status||'—')} · Criado: ${fmtDateTime(x.created_at)}</div></div>`).join('')}</div>`:'<div class="empty">Nenhum alerta ativo.</div>'}function renderDocs(docs=[]){if(!docs.length)return'<div class="empty">Nenhum documento encontrado.</div>';const s=docSummary(docs);return`<div class="doc-summary"><span class="doc-chip ok">${s.ok} OK</span><span class="doc-chip pending">${s.pending} Pendentes</span><span class="doc-chip critical">${s.critical} Críticos</span>${s.ok===docs.length?'<span class="doc-chip ok">Documentação Completa</span>':''}</div><div class="list">${docs.map((d,i)=>{const st=calcDoc(d.printed_status,d.dealer_center_status);return`<div class="item ${tone(st)}"><div class="item-title">${esc(d.document_name||'Documento')}</div><div class="doc-controls"><label>Printed${docSelect(i,'printed_status',d.printed_status)}</label><label>DealerCenter${docSelect(i,'dealer_center_status',d.dealer_center_status)}</label><span class="badge ${tone(st)}">${docLabel(st)}</span></div></div>`}).join('')}</div>`}function docSelect(i,f,v){v=v||'pending';return`<select class="status-select ${tone(v)}" onchange="setDocStatus(${i},'${f}',this)">${['pending','ok','missing'].map(x=>`<option value="${x}" ${v===x?'selected':''}>${docLabel(x)}</option>`).join('')}</select>`}async function setDocStatus(i,f,sel){const doc=detailState.documents[i],old=doc[f]||'pending';doc[f]=sel.value;doc.status=calcDoc(doc.printed_status,doc.dealer_center_status);renderDealDetails();const r=await post({action:'updateDocumentStatus',deal_id:detailState.id,document_name:doc.document_name,field:f,value:sel.value});if(!r.success){doc[f]=old;toast('Erro ao salvar documento')}else{if(r.document)detailState.documents[i]={...doc,...r.document};if(r.health)detailState.health=r.health;if(r.next_actions)detailState.actions=r.next_actions;toast('Documento atualizado!')}renderDealDetails()}function renderNotes(notes=[]){const list=notes.length?`<div class="list">${notes.map(n=>`<div class="item"><div class="item-title">${esc(n.note_text||'')}</div><div class="item-meta">Usuário: ${esc(n.user||'—')} · ${fmtDateTime(n.created_at)}</div></div>`).join('')}</div>`:'<div class="empty">Nenhuma nota interna registrada.</div>';return`<div class="note-box"><textarea id="internalNoteText" placeholder="Adicionar nota interna..."></textarea><button class="save" onclick="addNote()">Adicionar nota</button></div>${list}`}async function addNote(){const input=internalNoteText,text=input?input.value.trim():'';if(!detailState.id||!text)return;const r=await post({action:'addDealNote',deal_id:detailState.id,note_text:text,note_type:'internal'});if(!r.success){toast('Erro ao salvar nota');return}detailState.notes=[r.note,...detailState.notes];detailState.history=[{action:'add_internal_note',user:r.note.user||'',notes:r.note.note_text||'',timestamp:r.note.created_at},...detailState.history];renderDealDetails();toast('Nota adicionada!')}function renderHistory(h=[]){return h.length?`<div class="list">${h.map(x=>`<div class="item"><div class="item-title">${esc(x.action||'Evento')}</div><div class="item-meta">Usuário: ${esc(x.user||'—')} · ${fmtDateTime(x.timestamp)}</div><div class="item-meta">${esc(x.notes||'')}</div></div>`).join('')}</div>`:'<div class="empty">Nenhum evento registrado.</div>'}async function post(p){try{return await(await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(p)})).json()}catch(e){return{success:false,error:e.message}}}function openModal(){fData.value=new Date().toISOString().split('T')[0];modalOverlay.classList.remove('hidden')}function closeModal(){modalOverlay.classList.add('hidden')}function outsideModal(e){if(e.target===modalOverlay)closeModal()}async function saveDeal(){const payload=normalizeDeal({deal_id:fDeal.value.trim(),sale_date:fData.value,vin:fVin.value.trim().toUpperCase(),vehicle:fVeiculo.value.trim(),seller:fVendedor.value.trim(),gps_required:fGps.value});if(!payload.deal_id||!payload.veiculo){alert('Deal ID e Veículo são obrigatórios.');return}const r=await post({action:'saveDealMaster',...payload});if(!r.success){toast('Erro ao salvar');return}allDeals.unshift(payload);closeModal();renderTable();toast('Deal adicionado!')}function closeDealDetails(){detailOverlay.classList.add('hidden');detailState={id:null,deal:null,alerts:[],history:[],documents:[],notes:[],actions:[],health:null,loading:false}}function outsideDetail(e){if(e.target===detailOverlay)closeDealDetails()}function resolveAction(id){detailState.actions=detailState.actions.filter(a=>a.action_id!==id);renderDealDetails();toast('Ação marcada como resolvida')}function focusNote(t){const input=document.getElementById('internalNoteText');if(input){input.value=input.value||`Ação: ${t} - `;input.focus()}}function scrollDocs(){[...document.querySelectorAll('.section-title')].find(x=>x.textContent.toLowerCase().includes('document'))?.scrollIntoView({behavior:'smooth'})}function updateStats(){const total=allDeals.length,comp=allDeals.filter(isDone).length,crit=allDeals.filter(d=>d.critical_alert_count>0).length;sTotal.textContent=total+' total';sComplete.textContent=comp+' completos';sPending.textContent=(total-comp)+' pendentes';sCritical.textContent=crit+' críticos'}function agingInfo(d){if(String(d.dmv_status||'').toLowerCase()==='done')return null;const sale=dateVal(d.data);if(!sale)return null;const today=new Date(),a=new Date(sale.getFullYear(),sale.getMonth(),sale.getDate()),b=new Date(today.getFullYear(),today.getMonth(),today.getDate()),days=Math.max(0,Math.floor((b-a)/86400000));return{days,tone:days<=21?'green':days<=45?'yellow':days<=60?'orange':'red'}}function agingBadge(d){const a=agingInfo(d);return a?`<span class="aging-badge ${a.tone}">${a.days}d</span>`:'<span class="aging-badge">—</span>'}function alertBadge(d){const c=d.alert_count||0,cr=d.critical_alert_count||0;return`<span class="alert-badge ${cr?'critical':c?'pending':''}">${cr?`${cr} crítico / ${c}`:c}</span>`}function dateVal(v){if(!v)return null;if(v instanceof Date)return isNaN(v)?null:v;if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400*1000));return isNaN(d)?null:d}const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],12);m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return new Date(+m[3],+m[1]-1,+m[2],12);const d=new Date(s);return isNaN(d)?null:d}function fmtDate(v){const d=dateVal(v);return d?d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}):'—'}function fmtDateTime(v){const d=dateVal(v)||new Date(String(v||''));return isNaN(d)?'—':d.toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}function completeStatus(v){return['approved','paid','sent','done','created','received','electronic','not_needed'].includes(String(v||'').toLowerCase())}function isDone(d){return String(d.dmv_status||'').toLowerCase()==='done'||String(d.hub_status||'').toLowerCase()==='completed'}function calcDoc(p,d){p=String(p||'pending').toLowerCase();d=String(d||'pending').toLowerCase();if(p==='missing'||d==='missing')return'critical';if(p==='ok'&&d==='ok')return'ok';return'pending'}function docSummary(d){return d.reduce((a,x)=>{a[calcDoc(x.printed_status,x.dealer_center_status)]++;return a},{ok:0,pending:0,critical:0})}function docLabel(v){return{ok:'OK',pending:'Pendente',missing:'Missing',critical:'Crítico'}[String(v||'').toLowerCase()]||v||'—'}function statusLabel(f){return{review_status:'Review',commission_status:'Comissão',dmv_status:'DMV',parcelamento_status:'Parcelamento',title_status:'Title',omnia_status:'OMNIA',folder_status:'Folder',envelope_status:'Envelope'}[f]||f}function rangePairs(r){return[{label:'0-21',value:r.ok||0},{label:'22-45',value:r.attention||0},{label:'46-60',value:r.risk||0},{label:'60+',value:r.critical||0}]}function n(v){return v===undefined||v===null||v===''?'0':String(v)}function pct(v){return n(v)+'%'}function days(v){return v?`${v}d`:'—'}function short(v){v=String(v);return v.length>14?v.slice(0,13)+'…':v}function tone(p){return{critical:'critical',high:'high',medium:'medium',low:'ok',ok:'ok',pending:'pending',missing:'critical'}[String(p||'').toLowerCase()]||'pending'}function icon(c){return{DMV:'▣',Financeiro:'$',Documentacao:'□','Documentação':'□',Vendedor:'@',Operacional:'!'}[c]||'!'}function isCrit(v){return['critical','critico','crítico','high','alta'].includes(String(v||'').toLowerCase())}function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function attr(v){return esc(v).replace(/\n/g,'&#10;')}function js(v){return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function toast(m){const t=toastEl;t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}const fData=document.getElementById('f-data'),fDeal=document.getElementById('f-deal'),fVin=document.getElementById('f-vin'),fVeiculo=document.getElementById('f-veiculo'),fVendedor=document.getElementById('f-vendedor'),fGps=document.getElementById('f-gps'),toastEl=document.getElementById('toast');switchView('home');loadFromSheets();loadDashboard();</script></body></html>
