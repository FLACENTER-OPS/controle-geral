name: Codex Etapa 18B Direct Critical Doc Fix

on:
  push:
    paths:
      - '.github/workflows/codex-etapa18b-critical-doc-direct.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Code.gs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Code.gs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('docs.filter(d=>hasCriticalDocument([d])).length','docs.filter(isCriticalDocument).length')
          s=s.replace('docs.filter(hasCriticalDocument).length','docs.filter(isCriticalDocument).length')
          s=s.replace('(docsByDeal[String(i.deal.deal_id)]||[]).some(d=>hasCriticalDocument([d]))','(docsByDeal[String(i.deal.deal_id)]||[]).some(isCriticalDocument)')
          s=s.replace('(docsByDeal[String(i.deal.deal_id)]||[]).some(hasCriticalDocument)','(docsByDeal[String(i.deal.deal_id)]||[]).some(isCriticalDocument)')
          helper="function isCriticalDocument(d){if(!d||typeof d!=='object')return false;const p=val(d.printed_status),dc=val(d.dealer_center_status||d.dealercenter_status),st=val(d.status),calc=calculateDocumentStatusSafe(p,dc);return p==='missing'||dc==='missing'||st==='critical'||calc==='critical'}function hasCriticalDocument(docs){return Array.isArray(docs)&&docs.some(isCriticalDocument)}function calculateDocumentStatusSafe(p,d){p=val(p||'pending');d=val(d||'pending');if(p==='missing'||d==='missing')return'critical';if(['pending','pendente'].includes(p)||['pending','pendente'].includes(d))return'pending';if(p==='waived'||d==='waived')return'waived';if(p==='na'||d==='na')return'na';if(p==='ok'&&d==='ok')return'ok';return'pending'}"
          if 'function isCriticalDocument(' not in s:
              marker='function buildDashboardMetrics('
              if marker not in s:
                  raise SystemExit('buildDashboardMetrics marker not found')
              s=s.replace(marker,helper+marker,1)
          if 'filter(hasCriticalDocument)' in s or 'some(hasCriticalDocument)' in s or 'hasCriticalDocument([d])' in s:
              raise SystemExit('unsafe hasCriticalDocument callback remains')
          if 'filter(isCriticalDocument)' not in s or 'some(isCriticalDocument)' not in s:
              raise SystemExit('safe isCriticalDocument callbacks not present')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate syntax
        run: node -e "const fs=require('fs'); new Function(fs.readFileSync('Code.gs','utf8')); new Function(fs.readFileSync('index.html','utf8').match(/<script>([\s\S]*)<\/script>/)[1]); console.log('Code.gs and index.html OK')"
      - name: Commit patched files
        run: |
          git config user.name codex
          git config user.email codex@openai.com
          git add Code.gs
          git commit -m "Etapa 18B - Corrige erro docs.some"
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/codex-etapa18b-critical-doc-function.yml .github/workflows/codex-etapa18b-critical-doc-direct.yml
          git add .github/workflows/codex-etapa18b-critical-doc-function.yml .github/workflows/codex-etapa18b-critical-doc-direct.yml
          git commit --amend --no-edit
      - name: Push final commit
        run: git push