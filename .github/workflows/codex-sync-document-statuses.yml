name: Codex Sync Document Statuses

on:
  push:
    paths:
      - '.github/workflows/codex-sync-document-statuses.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Code.gs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Code.gs')
          text = path.read_text(encoding='utf-8')

          old = "const d=rowToObject(getHeaders(master),master.getRange(row,1,1,master.getLastColumn()).getValues()[0]),docs=getRowsByDealId(ensureSheet(ss,'DEAL_DOCUMENTS',DEAL_DOCUMENTS_HEADERS),id),alerts=ensureSheet(ss,'DEAL_ALERTS',DEAL_ALERTS_HEADERS),now=new Date().toISOString();"
          new = "const docsSheet=ensureSheet(ss,'DEAL_DOCUMENTS',DEAL_DOCUMENTS_HEADERS);syncDealDocumentStatuses(docsSheet,id);const d=rowToObject(getHeaders(master),master.getRange(row,1,1,master.getLastColumn()).getValues()[0]),docs=getRowsByDealId(docsSheet,id),alerts=ensureSheet(ss,'DEAL_ALERTS',DEAL_ALERTS_HEADERS),now=new Date().toISOString();"
          if old not in text:
              raise SystemExit('syncDealHealth document sheet target not found')
          text = text.replace(old, new, 1)

          marker = "function getAgingInfo(v){"
          helper = "function syncDealDocumentStatuses(sh,id){const v=sh.getDataRange().getValues(),h=getHeaders(sh);let changed=false;for(let i=1;i<v.length;i++){const d=rowToObject(h,v[i]);if(String(d.deal_id)!==String(id))continue;const s=calculateDocumentStatus(d.printed_status,d.dealer_center_status||d.dealercenter_status);if(s&&val(d.status)!==s){setCell(sh,i+1,h,'status',s);setCell(sh,i+1,h,'updated_at',new Date().toISOString());changed=true}}return changed}"
          if helper not in text:
              if marker not in text:
                  raise SystemExit('getAgingInfo marker not found')
              text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate Apps Script syntax
        run: node -e "const fs=require('fs'); new Function(fs.readFileSync('Code.gs','utf8')); new Function(fs.readFileSync('index.html','utf8').match(/<script>([\s\S]*)<\/script>/)[1]); console.log('Code.gs and index.html OK')"
      - name: Commit patched files
        run: |
          git config user.name codex
          git config user.email codex@openai.com
          git add Code.gs
          git commit -m "Etapa 16 - Sincroniza status real de documentos"
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/codex-sync-document-statuses.yml
          git add .github/workflows/codex-sync-document-statuses.yml
          git commit --amend --no-edit
      - name: Push final commit
        run: git push