name: Codex dashboard operational fix

on:
  push:
    paths:
      - '.github/workflows/codex-dashboard-operational-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard metrics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          code_path = Path('Code.gs')
          code = code_path.read_text(encoding='utf-8')

          new_build = """function buildDashboardMetrics(deals,alerts,docs,returns){const active=deals.filter(d=>!isCompletedMasterDeal(d)&&!isArchivedMasterDeal(d)),completed=deals.filter(isCompletedMasterDeal),activeIds=active.reduce((a,d)=>(a[String(d.deal_id)]=true,a),{}),operationalAlerts=alerts.filter(a=>activeIds[String(a.deal_id)]),operationalDocs=docs.filter(d=>activeIds[String(d.deal_id)]),aging=active.map(d=>getAgingInfo(d.sale_date)).filter(Boolean),alertsByDeal=groupBy(operationalAlerts,'deal_id'),docsByDeal=groupBy(operationalDocs,'deal_id'),healthItems=active.map(d=>{const al=alertsByDeal[String(d.deal_id)]||[],ag=val(d.dmv_status)==='done'?null:getAgingInfo(d.sale_date);return{deal:d,aging:ag,health:calculateDashboardHealth(al,ag)}}),hc=countBy(healthItems,'health'),docCounts=countDocumentStatuses(operationalDocs),ranges={ok:0,attention:0,risk:0,critical:0};aging.forEach(x=>ranges[slaRange(x.days)]++);const actionCenter=buildActionCenter(deals,alerts,docs,returns),sellerLeaderboard=buildSellerLeaderboard(active,alertsByDeal,docsByDeal),alertTypes=countBy(operationalAlerts,'alert_type'),alertPriorities=countBy(operationalAlerts,'priority'),completeDocDeals=active.filter(d=>calculateDealDocumentStatus(docsByDeal[String(d.deal_id)]||[])==='complete').length;return{summary:{activeDeals:active.length,criticalDeals:hc.critical||0,riskDeals:hc.risk||0,dmvPending:active.filter(d=>val(d.dmv_status)==='pending').length,parcelamentosPending:active.filter(isPendingParcelamento).length,criticalDocuments:docCounts.critical,aging60:aging.filter(x=>x.days>60).length,commissionPending:active.filter(d=>val(d.commission_status)==='pending').length,completedDeals:completed.length},health:{ok:hc.ok||0,attention:hc.attention||0,risk:hc.risk||0,critical:hc.critical||0,okPercent:percent(hc.ok||0,active.length),attentionPercent:percent(hc.attention||0,active.length),riskPercent:percent(hc.risk||0,active.length),criticalPercent:percent(hc.critical||0,active.length),openAlerts:operationalAlerts.length,averageAlertsPerActiveDeal:round(operationalAlerts.length/Math.max(active.length,1),1)},sla:{activeAverageAging:average(aging.map(x=>x.days)),completedAverageDays:0,ranges,over60:ranges.critical||0},alerts:{totalOpen:operationalAlerts.length,byType:objectToPairs(alertTypes),byPriority:objectToPairs(alertPriorities),topUrgent:operationalAlerts.slice(0,5)},documents:{ok:docCounts.ok,pending:docCounts.pending,critical:docCounts.critical,completePercent:percent(completeDocDeals,active.length),topPending:objectToPairs(countPendingDocuments(operationalDocs)).slice(0,5)},dmv:buildStatusMetrics(active,'dmv_status'),dmvSla:buildDmvSlaMetrics(active),parcelamentos:{parceladoSim:active.filter(isParceladoSim).length,pending:active.filter(d=>val(d.parcelamento_status)==='pending').length,created:active.filter(d=>val(d.parcelamento_status)==='created').length,critical:active.filter(isPendingParcelamento).length},commission:{pending:active.filter(d=>val(d.commission_status)==='pending').length,blocked:active.filter(d=>val(d.commission_status)==='blocked').length,approved:active.filter(d=>val(d.commission_status)==='approved').length,paid:active.filter(d=>val(d.commission_status)==='paid').length,pendingCriticalDeal:healthItems.filter(i=>i.health==='critical'&&val(i.deal.commission_status)==='pending').length,approvedCriticalDocs:healthItems.filter(i=>(docsByDeal[String(i.deal.deal_id)]||[]).some(hasCriticalDocument)&&val(i.deal.commission_status)==='approved').length,paidCriticalAlert:healthItems.filter(i=>(alertsByDeal[String(i.deal.deal_id)]||[]).some(a=>hasCriticalHealthAlert([a]))&&val(i.deal.commission_status)==='paid').length},sellerLeaderboard,actionCenter,charts:{healthScore:[{label:'OK',value:hc.ok||0},{label:'Atencao',value:hc.attention||0},{label:'Risco',value:hc.risk||0},{label:'Critico',value:hc.critical||0}],agingDistribution:[{label:'0-21',value:aging.filter(x=>x.days<=21).length},{label:'22-45',value:aging.filter(x=>x.days>21&&x.days<=45).length},{label:'46-60',value:aging.filter(x=>x.days>45&&x.days<=60).length},{label:'60+',value:aging.filter(x=>x.days>60).length}],alertsByType:objectToPairs(alertTypes).slice(0,8),dmvStatus:['pending','with_dispatcher','sent','rejected','resubmission_needed','done'].map(s=>({label:s,value:active.filter(d=>val(d.dmv_status)===s).length})),sellerPending:sellerLeaderboard.slice(0,8).map(i=>({label:i.seller,value:i.alerts+i.criticalDocuments}))}}}"""
          code, n = re.subn(r"function buildDashboardMetrics\(deals,alerts,docs,returns\)\{.*?\}\nfunction buildActionCenter", new_build + "\nfunction buildActionCenter", code, count=1)
          if n != 1:
              raise SystemExit('buildDashboardMetrics replacement failed')

          new_health = """function hasCriticalHealthAlert(alerts){return(alerts||[]).some(a=>['critical','critico','crítico'].includes(val(a.priority)))}function hasHighHealthAlert(alerts){return(alerts||[]).some(a=>['high','alta'].includes(val(a.priority)))}function calculateHealthScore(alerts,aging,docs){if(hasCriticalHealthAlert(alerts)||(aging&&aging.days>60))return'critical';if(hasHighHealthAlert(alerts)||(aging&&aging.days>=46&&aging.days<=60))return'risk';if((alerts||[]).length||(aging&&aging.days>=22&&aging.days<=45))return'attention';return'ok'}function calculateDashboardHealth(alerts,aging){if(hasCriticalHealthAlert(alerts)||(aging&&aging.days>60))return'critical';if(hasHighHealthAlert(alerts)||(aging&&aging.days>=46&&aging.days<=60))return'risk';if((alerts||[]).length||(aging&&aging.days>=22&&aging.days<=45))return'attention';return'ok'}"""
          code, n = re.subn(r"function calculateHealthScore\(alerts,aging,docs\)\{.*?\}function calculateDashboardHealth\(alerts,aging\)\{.*?\}", new_health, code, count=1)
          if n != 1:
              raise SystemExit('health replacement failed')
          code_path.write_text(code, encoding='utf-8')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          if '.risk,.orange' not in html:
              html = html.replace('.critical,.red,.high,.missing{color:var(--red)!important;background:rgba(239,68,68,.12)!important;border-color:rgba(239,68,68,.45)!important}', '.critical,.red,.high,.missing{color:var(--red)!important;background:rgba(239,68,68,.12)!important;border-color:rgba(239,68,68,.45)!important}.risk,.orange{color:#fb923c!important;background:rgba(251,146,60,.12)!important;border-color:rgba(251,146,60,.45)!important}')
          html = html.replace("${card('Deals Críticos',s.criticalDeals,'red','alertas')}${card('DMV Pendentes',s.dmvPending,'amber','dmv-pending')}", "${card('Deals Críticos',s.criticalDeals,'red','alertas')}${card('Deals em Risco',s.riskDeals,'orange','risk')}${card('DMV Pendentes',s.dmvPending,'amber','dmv-pending')}")
          html = html.replace("['Atenção',pct(h.attentionPercent)],['Críticos',pct(h.criticalPercent)]", "['Atenção',pct(h.attentionPercent)],['Risco',pct(h.riskPercent)],['Críticos',pct(h.criticalPercent)]")
          html = html.replace("currentFilter==='alertas'&&d.alert_count>0||currentFilter==='dmv-pending'", "currentFilter==='alertas'&&d.alert_count>0||currentFilter==='risk'&&(String(d.health_score||'').toLowerCase()==='risk'||age&&age.days>=46&&age.days<=60)||currentFilter==='dmv-pending'")
          html = html.replace("h.health_score==='critical'?'critical':h.health_score==='attention'?'pending':'ok'", "h.health_score==='critical'?'critical':h.health_score==='risk'?'orange':h.health_score==='attention'?'pending':'ok'")
          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Validate syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          new Function(fs.readFileSync('Code.gs','utf8'));
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).join('\n');
          new Function(scripts);
          NODE
      - name: Commit fix and remove workflow
        run: |
          rm -f .github/workflows/codex-dashboard-operational-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Code.gs index.html .github/workflows/codex-dashboard-operational-fix.yml
          git commit -m "Fix dashboard operational metrics for archived deals"
          git push
