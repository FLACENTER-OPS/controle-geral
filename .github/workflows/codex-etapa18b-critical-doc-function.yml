name: Codex Etapa 18B Critical Document Function

on:
  push:
    paths:
      - '.github/workflows/codex-etapa18b-critical-doc-function.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Code.gs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Code.gs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('docs.filter(d=>hasCriticalDocument([d])).length','docs.filter(isCriticalDocument).length')
          s=s.replace('(docsByDeal[String(i.deal.deal_id)]||[]).some(d=>hasCriticalDocument([d]))','(docsByDeal[String(i.deal.deal_id)]||[]).some(isCriticalDocument)')
          s=s.replace('docs.filter(hasCriticalDocument).length','docs.filter(isCriticalDocument).length')
          s=s.replace('(docsByDeal[String(i.deal.deal_id)]||[]).some(hasCriticalDocument)','(docsByDeal[String(i.deal.deal_id)]||[]).some(isCriticalDocument)')
          old="function hasCriticalDocument(docs){return docs.some(d=>{const s=calculateDocumentStatus(d.printed_status,d.dealer_center_status||d.dealercenter_status);return s==='critical'||val(d.status)==='critical'&&!isNonBlockingDocumentValue(s)})}"
          new="function isCriticalDocument(d){if(!d||typeof d!=='object')return false;const p=val(d.printed_status),dc=val(d.dealer_center_status||d.dealercenter_status),s=val(d.status),calc=calculateDocumentStatus(p,dc);return p==='missing'||dc==='missing'||calc==='critical'||s==='critical'&&!isNonBlockingDocumentValue(calc)}function hasCriticalDocument(docs){return Array.isArray(docs)&&docs.some(isCriticalDocument)}"
          if old in s:
              s=s.replace(old,new,1)
          elif 'function isCriticalDocument(' not in s:
              marker='function calculateDocumentStatus('
              if marker not in s:
                  raise SystemExit('critical document insertion marker not found')
              s=s.replace(marker,new+marker,1)
          if 'filter(hasCriticalDocument)' in s or 'some(hasCriticalDocument)' in s or 'hasCriticalDocument([d])' in s:
              raise SystemExit('unsafe hasCriticalDocument callback remains')
          if 'function isCriticalDocument(' not in s:
              raise SystemExit('isCriticalDocument missing after patch')
          if 'Array.isArray(docs)&&docs.some(isCriticalDocument)' not in s:
              raise SystemExit('hasCriticalDocument array guard missing after patch')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate syntax
        run: node -e "const fs=require('fs'); new Function(fs.readFileSync('Code.gs','utf8')); new Function(fs.readFileSync('index.html','utf8').match(/<script>([\s\S]*)<\/script>/)[1]); console.log('Code.gs and index.html OK')"
      - name: Commit patched files
        run: |
          git config user.name codex
          git config user.email codex@openai.com
          git add Code.gs
          git commit -m "Etapa 18B - Corrige hasCriticalDocument"
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/codex-etapa18b-critical-doc-function.yml
          git add .github/workflows/codex-etapa18b-critical-doc-function.yml
          git commit --amend --no-edit
      - name: Push final commit
        run: git push