name: Codex seller document info

on:
  push:
    paths:
      - '.github/workflows/codex-seller-document-info.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch document seller info
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          code_path=Path('Code.gs')
          code=code_path.read_text(encoding='utf-8')
          code=code.replace("const DEAL_DOCUMENTS_HEADERS=['deal_id','document_name','printed_status','dealer_center_status','status','created_at','updated_at'];", "const DEAL_DOCUMENTS_HEADERS=['deal_id','document_name','printed_status','dealer_center_status','status','created_at','updated_at','seller_status','seller_exception_reason'];")
          code=code.replace("'deal_id', 'document_name', 'printed_status', 'dealer_center_status', 'status', 'created_at', 'updated_at'", "'deal_id', 'document_name', 'printed_status', 'dealer_center_status', 'status', 'created_at', 'updated_at', 'seller_status', 'seller_exception_reason'")
          code=code.replace("!['pending','ok','missing',''].includes(value)", "!['pending','ok','missing','na','waived',''].includes(value)")
          code=code.replace("!['pending', 'ok', 'missing', ''].includes(value)", "!['pending', 'ok', 'missing', 'na', 'waived', ''].includes(value)")
          code=code.replace("'update_document'", "'document_status_changed'")
          code=code.replace("if(printed==='ok'&&dealerCenter==='ok')return'ok';", "if(['ok','na','waived'].includes(printed)&&['ok','na','waived'].includes(dealerCenter))return'ok';")
          code=code.replace("if (printed === 'ok' && dealerCenter === 'ok') return 'ok';", "const nonBlocking = ['ok', 'na', 'waived'];\n  if (nonBlocking.includes(printed) && nonBlocking.includes(dealerCenter)) return 'ok';")
          code_path.write_text(code,encoding='utf-8')

          html_path=Path('index.html')
          html=html_path.read_text(encoding='utf-8')
          if '.blue{' not in html and '.blue{color' not in html:
            html=html.replace('.orange{color:#fb923c!important;border-color:rgba(249,115,22,.5)!important;background:rgba(249,115,22,.12)!important}', '.orange{color:#fb923c!important;border-color:rgba(249,115,22,.5)!important;background:rgba(249,115,22,.12)!important}.blue{color:var(--blue-light)!important;border-color:rgba(59,130,246,.5)!important;background:rgba(37,99,235,.12)!important}')
            html=html.replace('.risk,.orange{color:#fb923c!important;background:rgba(251,146,60,.12)!important;border-color:rgba(251,146,60,.45)!important}', '.risk,.orange{color:#fb923c!important;background:rgba(251,146,60,.12)!important;border-color:rgba(251,146,60,.45)!important}.blue{color:#3b82f6!important;background:rgba(59,130,246,.12)!important;border-color:rgba(59,130,246,.5)!important}')
          # Remote compact UI uses renderDocs/docSelect/calcDoc/docLabel.
          html=html.replace("<div class=\"item-title\">${esc(d.document_name||'Documento')}</div><div class=\"doc-controls\">", "<div class=\"item-title\">${esc(d.document_name||'Documento')}</div>${sellerDocInfo(d)}<div class=\"doc-controls\">")
          if 'function sellerDocInfo' not in html:
            html=html.replace('function docSelect', "function sellerDocInfo(d){if(!d.seller_status&&!d.seller_exception_reason)return'';return `<div class=\"item-meta\">Status vendedor: ${sellerDocStatusLabel(d.seller_status||'—')}${d.seller_exception_reason?`<br>Motivo: ${esc(d.seller_exception_reason)}`:''}</div>`}function sellerDocStatusLabel(v){return{received:'Recebido',not_received:'Não recebido',exception:'Exceção'}[String(v||'').toLowerCase()]||esc(v||'—')}function docSelect")
            html=html.replace('function documentStatusSelect', "function sellerDocumentInfo(doc){if(!doc.seller_status&&!doc.seller_exception_reason)return'';return `<div class=\"detail-item-meta\">Status vendedor: ${documentSellerStatusLabel(doc.seller_status||'—')}${doc.seller_exception_reason?`<br>Motivo: ${escapeHtml(doc.seller_exception_reason)}`:''}</div>`}function documentSellerStatusLabel(v){return{received:'Recebido',not_received:'Não recebido',exception:'Exceção'}[String(v||'').toLowerCase()]||escapeHtml(v||'—')}function documentStatusSelect")
          html=html.replace("['pending','ok','missing'].map", "['pending','ok','missing','na','waived'].map")
          html=html.replace("const value=doc[field]||'pending',index=detailState.documents.indexOf(doc);", "const value=doc[field]||'pending',index=detailState.documents.indexOf(doc);")
          html=html.replace("if(p==='ok'&&d==='ok')return'ok';", "if(['ok','na','waived'].includes(p)&&['ok','na','waived'].includes(d))return'ok';")
          html=html.replace("if(p==='ok'&&dc==='ok')return'ok';", "if(['ok','na','waived'].includes(p)&&['ok','na','waived'].includes(dc))return'ok';")
          html=html.replace("{ok:'OK',pending:'Pendente',missing:'Missing',critical:'Crítico'}", "{ok:'OK',pending:'Pendente',missing:'Missing',critical:'Crítico',na:'N/A',waived:'Dispensa Aprovada'}")
          html=html.replace("{ok:'OK',pending:'Pendente',missing:'Missing',critical:'CrÃ­tico'}", "{ok:'OK',pending:'Pendente',missing:'Missing',critical:'Crítico',na:'N/A',waived:'Dispensa Aprovada'}")
          html=html.replace("{ok:'OK',pending:'Pendente',missing:'Missing',critical:'Cr\\u00edtico'}", "{ok:'OK',pending:'Pendente',missing:'Missing',critical:'Cr\\u00edtico',na:'N/A',waived:'Dispensa Aprovada'}")
          html=html.replace("return{ok:'ok',pending:'pending',missing:'critical',critical:'critical'}[s]", "return{ok:'ok',pending:'pending',missing:'critical',critical:'critical',na:'muted',waived:'blue'}[s]")
          html=html.replace("return ['ok','pending','critical'].includes(s)?s:statusToneClass(s)", "return{ok:'ok',pending:'pending',missing:'critical',critical:'critical',na:'muted',waived:'blue'}[s]||statusToneClass(s)")
          html=html.replace("return TONES[String(p||'').toLowerCase()]||{critical:'critical',high:'high',medium:'medium',low:'ok',ok:'ok',pending:'pending',missing:'critical'}", "return TONES[String(p||'').toLowerCase()]||{critical:'critical',high:'high',medium:'medium',low:'ok',ok:'ok',pending:'pending',missing:'critical',na:'muted',waived:'blue'}")
          html_path.write_text(html,encoding='utf-8')
          PY
      - name: Validate files
        run: |
          node - <<'NODE'
          const fs=require('fs');
          new Function(fs.readFileSync('Code.gs','utf8'));
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).join('\n');
          new Function(scripts);
          NODE
      - name: Commit fix and remove workflow
        run: |
          rm -f .github/workflows/codex-seller-document-info.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Code.gs index.html .github/workflows/codex-seller-document-info.yml
          git commit -m "Etapa 14 - Exibe status e excecao do vendedor"
          git push
